<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GAIA DMX Touch</title>
<style>
:root {
  --bg:#08090f; --card:#0e1221; --border:#1e2840;
  --accent:#00ffcc; --red:#f85149; --yellow:#e3b341;
  --text:#c9d1d9; --muted:#6b7a99;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;
     display:flex;flex-direction:column;padding:10px;gap:8px}

.topbar{display:flex;align-items:center;gap:10px;flex-shrink:0}
.topbar h1{font-size:1rem;color:var(--accent);font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex-shrink:0}
.dot.ok{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.dot.err{background:var(--red)}
.swatch{margin-left:auto;width:36px;height:36px;border-radius:8px;border:2px solid var(--border);background:#000}

.fixtures{display:flex;gap:6px;flex-shrink:0}
.fx-btn{flex:1;border:2px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);
        font-size:.8rem;font-weight:700;padding:8px}
.fx-btn.active{border-color:var(--accent);color:var(--accent)}

.palettes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1;min-height:0}
.pal-btn{border:2px solid var(--border);border-radius:10px;font-size:.85rem;font-weight:600;
         color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);display:flex;align-items:center;
         justify-content:center;padding:4px}
.pal-btn.active{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}

.timelines{display:flex;gap:6px;flex-shrink:0;overflow-x:auto}
.tl-preset{border:2px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);
           font-size:.78rem;font-weight:600;padding:10px 14px;white-space:nowrap;flex-shrink:0}
.tl-preset.active{border-color:var(--accent);color:var(--accent)}

.controls{display:flex;gap:8px;flex-shrink:0;align-items:center}
.controls input[type=range]{flex:1;height:40px;accent-color:var(--accent)}
.btn{border:none;border-radius:10px;font-size:.85rem;font-weight:700;padding:14px 10px;color:#000;
     background:var(--border);color:var(--text)}
.btn.blackout{background:var(--red);color:#fff;min-width:80px}
.btn.tl{background:var(--card);border:2px solid var(--border);color:var(--text);min-width:56px}
.btn.tl.active{border-color:var(--accent);color:var(--accent)}
.btn.audio{background:var(--card);border:2px solid var(--border);color:var(--text);min-width:56px}
.btn.audio.active{border-color:var(--yellow);color:var(--yellow);background:#2a2010}
.btn:active{opacity:.7}

.icon-btn{border:2px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);
          font-size:1rem;width:36px;height:36px;flex-shrink:0}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;
         justify-content:center;z-index:10}
.overlay.open{display:flex}
.sheet{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:16px;
       width:min(92vw,520px);max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:.95rem;color:var(--accent);display:flex;align-items:center;justify-content:space-between}
.band-row{display:flex;flex-direction:column;gap:4px}
.band-row label{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.band-row label span.val{color:var(--text);font-weight:700}
.band-row input[type=range]{width:100%;height:34px;accent-color:var(--accent)}
.band-row select{width:100%;height:40px;background:var(--bg);border:2px solid var(--border);
                  border-radius:8px;color:var(--text);font-size:.85rem;padding:0 8px}
.meter{height:8px;border-radius:4px;background:#000;overflow:hidden;border:1px solid var(--border)}
.meter i{display:block;height:100%;background:var(--accent);width:0%;transition:width .08s linear}
</style>
</head>
<body>

<div class="topbar">
  <span class="dot" id="dot"></span>
  <h1 id="title">GAIA DMX</h1>
  <div class="swatch" id="swatch"></div>
  <button class="icon-btn" id="audio-settings-btn" onclick="openAudioSheet()" title="Audio: gain/bande">🎚️</button>
  <button class="icon-btn" onclick="openPowerSheet()" title="Calibrazione power min/max">📏</button>
  <button class="icon-btn" onclick="goEditor()" title="Editor preset">✏️</button>
</div>

<div class="overlay" id="audio-overlay" onclick="if(event.target===this) closeAudioSheet()">
  <div class="sheet">
    <h2>🎚️ Audio — gain &amp; bande <button class="icon-btn" onclick="closeAudioSheet()">✕</button></h2>
    <div class="band-row">
      <label>Dispositivo</label>
      <select id="audio-device-select" onchange="onAudioDevice(this.value)"></select>
    </div>
    <div class="band-row">
      <label>Gain <span class="val" id="gain-val">1.0x</span></label>
      <input type="range" id="gain-slider" min="10" max="300" value="100" oninput="onGain(this.value)">
    </div>
    <div class="band-row">
      <label>Bassi <span class="val" id="low-val">1.0x</span></label>
      <div class="meter"><i id="low-meter"></i></div>
      <input type="range" id="low-slider" min="10" max="300" value="100" oninput="onBandGain('low',this.value)">
    </div>
    <div class="band-row">
      <label>Medi <span class="val" id="mid-val">1.0x</span></label>
      <div class="meter"><i id="mid-meter"></i></div>
      <input type="range" id="mid-slider" min="10" max="300" value="100" oninput="onBandGain('mid',this.value)">
    </div>
    <div class="band-row">
      <label>Alti <span class="val" id="high-val">1.0x</span></label>
      <div class="meter"><i id="high-meter"></i></div>
      <input type="range" id="high-slider" min="10" max="300" value="100" oninput="onBandGain('high',this.value)">
    </div>
  </div>
</div>

<div class="overlay" id="power-overlay" onclick="if(event.target===this) closePowerSheet()">
  <div class="sheet">
    <h2>📏 Calibrazione <button class="icon-btn" onclick="closePowerSheet()">✕</button></h2>
    <div class="band-row">
      <label>Power min <span class="val" id="pmin-val">0%</span></label>
      <input type="range" id="pmin-slider" min="0" max="100" value="0" oninput="onPowerMin(this.value)">
    </div>
    <div class="band-row">
      <label>Power max <span class="val" id="pmax-val">100%</span></label>
      <input type="range" id="pmax-slider" min="0" max="100" value="100" oninput="onPowerMax(this.value)">
    </div>
  </div>
</div>

<div class="fixtures" id="fixtures" style="display:none"></div>

<div class="palettes" id="palettes"></div>

<div class="timelines" id="timelines"></div>

<div class="controls">
  <button class="btn tl" id="tl-start" onclick="tlStart()" title="Riprendi">▶</button>
  <button class="btn tl" id="tl-stop" onclick="tlStop()" title="Pausa">■</button>
  <button class="btn audio" id="audio-btn" onclick="toggleAudio()" title="Audio-reattività">🎤</button>
  <input type="range" id="brightness" min="0" max="100" value="100" oninput="onBrightness(this.value)">
  <button class="btn blackout" onclick="blackout()">⏻ OFF</button>
</div>

<script>
// Pagina touch "mini menu" per gaia-dmx (pi/dmx/main.py) -- pensata per un
// display DSI 800x480 montato su un Pi con quel servizio attivo. Stanza
// presa da ?room=, default "ingresso" (primo Pi su cui gaia-dmx è stato
// provato, 2026-10-02) -- riusabile su altri Pi passando un room diverso
// nell'URL di kiosk.conf (KIOSK_URL), nessun nome hardcoded nella logica.
// ?fixture= sceglie quale fixture controllare se il device ne ha più di
// una (2026-10-03, vedi pi/dmx/fixtures.json) -- senza, parte da quella
// di default (prima in ordine alfabetico) appena arriva il primo status.
const params = new URLSearchParams(location.search);
const ROOM = params.get('room') || 'ingresso';
let FIXTURE = params.get('fixture') || null;
document.getElementById('title').textContent = `GAIA DMX — ${ROOM}`;

const PALETTE_COLORS = {
  // Colori di sfondo dei bottoni -- stessi valori di pi/dmx/palettes.json,
  // duplicati qui solo per il rendering (la lista VERA dei nomi arriva
  // sempre dal device via status, mai hardcodata: se domani si aggiunge
  // una palette nuova qui sotto resta grigia ma funziona comunque).
  Warm: '#ffa03c', Cool: '#3c8cff', Fire: '#ff3c00', Ocean: '#0078b4',
  Forest: '#14a03c', Sunset: '#ff5a28', Magenta: '#dc00b4', White: '#ffffff', Off: '#222',
};

let client = null;
let lastPalette = null;
let lastTimelineRunning = false;
let lastTimelinePreset = null;
let lastAudioReactive = false;

function setConn(ok) {
  document.getElementById('dot').className = 'dot ' + (ok ? 'ok' : 'err');
}

function sendCmd(cmd, shared) {
  if (!client || !client.connected) return;
  // "shared" = azione non legata a una fixture (timeline_save/delete,
  // reload_*) -- oggi questa pagina non le usa, ma il parametro resta per
  // chiarezza/coerenza con l'editor (web/dmx-editor.html).
  if (!shared && FIXTURE) cmd = { ...cmd, fixture: FIXTURE };
  client.publish(`gaia/dmx/${ROOM}/command`, JSON.stringify(cmd));
}

function setPalette(name) {
  sendCmd({ action: 'set_palette', palette: name, fade: 0.8 });
}
function blackout() { sendCmd({ action: 'blackout' }); }
function tlStart() { sendCmd({ action: 'timeline_start' }); }
function tlStop()  { sendCmd({ action: 'timeline_stop' }); }
function tlLoad(name) { sendCmd({ action: 'timeline_load', name }); }
function onBrightness(v) { sendCmd({ action: 'set_brightness', value: v / 100 }); }
function toggleAudio() {
  sendCmd({ action: lastAudioReactive ? 'audio_reactive_stop' : 'audio_reactive_start' });
}

function goEditor() {
  location.href = `dmx-editor.html?room=${encodeURIComponent(ROOM)}`;
}

// Gain + bande (2026-10-05): solo taratura/monitoraggio, azione condivisa
// (non per fixture) -- vedi nota in pi/dmx/main.py. I valori mostrati
// vengono SEMPRE da status (mai letti/scritti in locale), stesso pattern
// del resto della pagina.
function openAudioSheet() { document.getElementById('audio-overlay').classList.add('open'); }
function closeAudioSheet() { document.getElementById('audio-overlay').classList.remove('open'); }
function onGain(v) { sendCmd({ action: 'audio_tune', gain: v / 100 }, true); }
function onBandGain(band, v) { sendCmd({ action: 'audio_tune', [band]: v / 100 }, true); }
function onAudioDevice(id) { sendCmd({ action: 'audio_set_device', device: id }, true); }

let lastAudioDeviceList = null;   // evita di ridisegnare il <select> ad ogni status (perderebbe il focus/la scelta a meta' tocco)
function renderAudioDevices(devices, current) {
  const key = JSON.stringify(devices) + '|' + current;
  if (key === lastAudioDeviceList) return;
  lastAudioDeviceList = key;
  const sel = document.getElementById('audio-device-select');
  sel.innerHTML = devices.map(d =>
    `<option value="${d.id}"${d.id === current ? ' selected' : ''}>${d.label}</option>`).join('');
}

// Calibrazione power min/max (2026-10-05): PER fixture (FIXTURE corrente),
// a differenza di gain/bande che sono condivisi -- sendCmd senza "true"
// ci inietta "fixture" da solo, stesso meccanismo di set_brightness.
function openPowerSheet() { document.getElementById('power-overlay').classList.add('open'); }
function closePowerSheet() { document.getElementById('power-overlay').classList.remove('open'); }
function onPowerMin(v) { sendCmd({ action: 'set_power_range', min: v / 100 }); }
function onPowerMax(v) { sendCmd({ action: 'set_power_range', max: v / 100 }); }

function renderFixtures(fixtures) {
  const ids = Object.keys(fixtures).sort();
  const wrap = document.getElementById('fixtures');
  if (ids.length <= 1) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';
  wrap.innerHTML = ids.map(id => {
    const active = id === FIXTURE ? ' active' : '';
    return `<button class="fx-btn${active}" data-fx="${id}">${id.toUpperCase()}</button>`;
  }).join('');
  wrap.querySelectorAll('[data-fx]').forEach(el => {
    el.onclick = () => { FIXTURE = el.dataset.fx; applyStatus(lastStatus); };
  });
}

function renderTimelines(presets) {
  // presets: {nome: {steps, loop}} -- qui serve solo l'elenco dei nomi,
  // il contenuto lo usa l'editor (web/dmx-editor.html).
  const wrap = document.getElementById('timelines');
  const names = Object.keys(presets).sort();
  wrap.innerHTML = names.map(n => {
    const active = n === lastTimelinePreset ? ' active' : '';
    return `<button class="tl-preset${active}" data-tl="${n}">${n}</button>`;
  }).join('');
  wrap.querySelectorAll('[data-tl]').forEach(el => {
    el.onclick = () => tlLoad(el.dataset.tl);
  });
}

function renderPalettes(names, rgbMap) {
  // Colore reale da status (palettes_rgb, 2026-10-05) se c'è -- cosi' una
  // palette personalizzata aggiunta dall'editor (web/dmx-editor.html) ha
  // subito il colore giusto qui, non il grigio di fallback. PALETTE_COLORS
  // resta solo per compatibilità con un service vecchio che non manda
  // ancora palettes_rgb.
  const wrap = document.getElementById('palettes');
  wrap.innerHTML = names.map(n => {
    const rgb = (rgbMap || {})[n];
    const bg = rgb ? `rgb(${rgb[0]},${rgb[1]},${rgb[2]})` : (PALETTE_COLORS[n] || '#333');
    const active = n === lastPalette ? ' active' : '';
    return `<button class="pal-btn${active}" style="background:${bg}" data-pal="${n}">${n}</button>`;
  }).join('');
  wrap.querySelectorAll('[data-pal]').forEach(el => {
    el.onclick = () => setPalette(el.dataset.pal);
  });
}

let lastStatus = null;

function applyStatus(d) {
  lastStatus = d;
  const fixtures = d.fixtures || {};
  if (!FIXTURE || !fixtures[FIXTURE]) FIXTURE = d.default_fixture || Object.keys(fixtures).sort()[0];
  const fx = fixtures[FIXTURE] || {};
  lastPalette = fx.current_palette;
  lastTimelineRunning = !!fx.timeline_running;
  lastTimelinePreset = fx.current_timeline_preset;
  lastAudioReactive = !!fx.audio_reactive;
  renderFixtures(fixtures);
  renderPalettes(d.palettes || [], d.palettes_rgb);
  renderTimelines(d.timeline_presets || {});
  const [r, g, b] = fx.output_rgb || [0, 0, 0];
  document.getElementById('swatch').style.background = `rgb(${r},${g},${b})`;
  document.getElementById('brightness').value = Math.round((fx.brightness ?? 1) * 100);
  document.getElementById('tl-start').classList.toggle('active', lastTimelineRunning);
  document.getElementById('audio-btn').classList.toggle('active', lastAudioReactive);
  applyAudioTune(d);
  applyPowerRange(fx);
}

function applyPowerRange(fx) {
  const pmin = fx.power_min ?? 0, pmax = fx.power_max ?? 1;
  document.getElementById('pmin-slider').value = Math.round(pmin * 100);
  document.getElementById('pmin-val').textContent = Math.round(pmin * 100) + '%';
  document.getElementById('pmax-slider').value = Math.round(pmax * 100);
  document.getElementById('pmax-val').textContent = Math.round(pmax * 100) + '%';
}

function applyAudioTune(d) {
  renderAudioDevices(d.audio_devices || [{ id: 'default', label: 'Automatico (default)' }], d.audio_device || 'default');
  const gain = d.audio_gain ?? 1.0;
  const bg = d.audio_band_gain || {};
  const bands = d.audio_bands || {};
  document.getElementById('gain-slider').value = Math.round(gain * 100);
  document.getElementById('gain-val').textContent = gain.toFixed(1) + 'x';
  ['low', 'mid', 'high'].forEach(b => {
    const g = bg[b] ?? 1.0;
    document.getElementById(`${b}-slider`).value = Math.round(g * 100);
    document.getElementById(`${b}-val`).textContent = g.toFixed(1) + 'x';
    document.getElementById(`${b}-meter`).style.width = Math.round((bands[b] ?? 0) * 100) + '%';
  });
}

function start() {
  // Broker locale (2026-10-05) se questa pagina è servita dal Pi stesso
  // (porta 8099, vedi pi/dmx/main.py _start_local_webserver) -- funziona
  // anche senza rete verso Core (uso "in giro"). Se invece la pagina
  // arriva da un altro host (es. OPS via Admin), niente broker locale
  // lì: resta il broker di Core come sempre.
  const BROKER_HOST = location.port === '8099' ? location.hostname : '192.168.1.142';
  client = mqtt.connect(`ws://${BROKER_HOST}:9001`, { connectTimeout: 4000 });
  client.on('connect', () => {
    setConn(true);
    client.subscribe(`gaia/dmx/${ROOM}/status`);
  });
  client.on('error',   () => setConn(false));
  client.on('offline', () => setConn(false));
  client.on('message', (topic, raw) => {
    if (!raw || !raw.length) return;
    try { applyStatus(JSON.parse(raw.toString())); } catch (e) {}
  });
}

if (typeof mqtt !== 'undefined') {
  start();
} else {
  const s = document.createElement('script');
  s.src = 'vendor/mqtt.min.js';
  s.onload = start;
  document.head.appendChild(s);
}
</script>
</body>
</html>
