<title>Plancia OSC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra strumenti / palco a griglia 16x10 a tutto schermo / ispettore laterale (sheet su mobile) / striscia monitor OSC.
   Look scuro unico e voluto: è una superficie di controllo da palco. */
:root{
  color-scheme:dark;
  --bg:#0c0e11; --panel:#14171c; --panel2:#1b1f26; --line:#272c35; --line2:#353b46;
  --fg:#e9ebef; --dim:#868e9b; --accent:#ffb23e; --ok:#4fd18b; --bad:#ff5d5d;
  --display:"Barlow Condensed","Arial Narrow",ui-sans-serif,sans-serif;
  --body:"Barlow",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- barra ---------- */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;padding-block:10px;min-width:0}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:17px;display:flex;align-items:center;gap:8px}
.brand .mark{width:14px;height:14px;border:2px solid var(--accent);border-radius:3px;position:relative}
.brand .mark::after{content:"";position:absolute;inset:3px;background:var(--accent);border-radius:1px}
.tabs{display:flex;gap:4px;min-width:0;flex:1 1 0;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
.tab{background:none;border:1px solid transparent;border-radius:6px;padding:6px 12px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.tab[aria-current="true"]{color:var(--fg);border-color:var(--line2);background:var(--panel)}
.tab.add{color:var(--accent);font-family:var(--mono);font-size:14px}
.spacer{display:none}
.bar>.pill,.bar>.btn{flex:none}
.pill{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 10px;font-size:13px;color:var(--dim);max-width:100%;min-width:0}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none}
.pill.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill.on{color:var(--fg)}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:6px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1205}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:#4a2a2c;background:none}
.btn.sm{padding:4px 10px;font-size:13px}
.addbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-bottom:10px}
.addbar .cap{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--dim);margin-right:4px}
.addbar button{background:var(--panel);border:1px dashed var(--line2);border-radius:6px;padding:5px 11px;font-size:13px}
.addbar button:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- palco della griglia ---------- */
.main{flex:1;display:flex;gap:12px;min-height:0}
.stage{flex:1;position:relative;min-width:0;border-radius:8px}
.editing .stage{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:calc(100% / 16) calc(100% / 10);outline:1px solid var(--line)}
.w{position:absolute;padding:4px;--c:var(--accent)}
.box{position:relative;height:100%;background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.lab{position:absolute;top:7px;left:9px;right:9px;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;z-index:2;text-shadow:0 1px 2px #000a}
.val{position:absolute;bottom:6px;right:9px;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--fg);pointer-events:none;z-index:2;text-shadow:0 1px 2px #000a}
.addr{position:absolute;bottom:6px;left:9px;right:9px;font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none;pointer-events:none;z-index:4}
.editing .addr{display:block}
.editing .val{display:none}
.w.active .box{border-color:var(--c)}

/* fader & indicatore */
.trk{position:absolute;inset:0}
.fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,color-mix(in srgb,var(--c) 55%,transparent),color-mix(in srgb,var(--c) 22%,transparent));border-top:3px solid var(--c)}
.hz .fill{top:0;bottom:0;right:auto;width:0;border-top:0;border-right:3px solid var(--c);background:linear-gradient(to right,color-mix(in srgb,var(--c) 22%,transparent),color-mix(in srgb,var(--c) 55%,transparent))}
.t-fader .trk::before{content:"";position:absolute;left:50%;top:30px;bottom:24px;width:1px;background:var(--line2)}
.t-fader.hz .trk::before{left:12px;right:12px;top:50%;bottom:auto;width:auto;height:1px}
.t-meter .fill{border-top:0;background:var(--c);-webkit-mask:repeating-linear-gradient(to top,#000 0 5px,transparent 5px 7px);mask:repeating-linear-gradient(to top,#000 0 5px,transparent 5px 7px);opacity:.9}
.t-meter.hz .fill{border-right:0;-webkit-mask:repeating-linear-gradient(to right,#000 0 5px,transparent 5px 7px);mask:repeating-linear-gradient(to right,#000 0 5px,transparent 5px 7px)}
.t-meter .lab{font-size:12px;left:6px;right:6px}

/* manopola */
.knob{position:absolute;inset:24px 6px 18px}
.knob svg{width:100%;height:100%;display:block}
.knob .tr{fill:none;stroke:var(--line2);stroke-width:7;stroke-linecap:round}
.knob .vl{fill:none;stroke:var(--c);stroke-width:7;stroke-linecap:round}
.knob .cap{fill:var(--panel2);stroke:var(--line2);stroke-width:1.5}
.knob .ptr{stroke:var(--fg);stroke-width:4;stroke-linecap:round}

/* pulsante */
.t-button .box{display:grid;place-items:center}
.t-button .lab{position:static;text-align:center;font-size:16px;padding-inline:8px}
.t-button.on .box{background:color-mix(in srgb,var(--c) 30%,var(--panel));border-color:var(--c);box-shadow:inset 0 0 22px color-mix(in srgb,var(--c) 40%,transparent)}
.t-button.on .lab{color:#fff}
.t-button.press .box{transform:scale(.97)}
.t-button .tag{position:absolute;top:6px;right:8px;font-family:var(--mono);font-size:10px;color:var(--dim)}

/* pad XY */
.pad{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:25% 25%;background-position:-1px -1px}
.pad .hx,.pad .vy{position:absolute;background:color-mix(in srgb,var(--c) 55%,transparent)}
.pad .hx{left:0;right:0;height:1px}
.pad .vy{top:0;bottom:0;width:1px}
.pad .dot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 30%,transparent);box-shadow:0 0 16px color-mix(in srgb,var(--c) 50%,transparent)}

/* testo */
.t-label .box{background:none;border-color:transparent;display:flex;align-items:center}
.t-label .lab{position:static;font-size:clamp(16px,2.4vw,30px);color:var(--c);letter-spacing:.1em;padding-inline:6px}
.editing .t-label .box{border:1px dashed var(--line2)}

/* griglia scene */
.sc{position:absolute;inset:28px 6px 6px;display:grid;gap:5px;grid-auto-rows:1fr}
.si{position:relative;min-height:0;min-width:0;border:1px solid var(--line2);border-radius:5px;background:var(--panel2);display:flex;flex-direction:column;justify-content:space-between;padding:4px 7px 5px 9px;overflow:hidden}
.si .no{font-family:var(--mono);font-size:10px;color:var(--dim);line-height:1}
.si .nm{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si .chip{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ic,var(--c))}
.si .prog{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--fg)}
.si.on{background:color-mix(in srgb,var(--ic,var(--c)) 26%,var(--panel2));border-color:var(--ic,var(--c));box-shadow:inset 0 0 18px color-mix(in srgb,var(--ic,var(--c)) 30%,transparent)}
.si.on .no{color:var(--fg)}

/* colore */
.cw{position:absolute;inset:28px 8px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;container-type:size}
.disc{width:min(100cqw,calc(100cqh - 30px));aspect-ratio:1;border-radius:50%;position:relative;flex:none;
  background:radial-gradient(circle closest-side,#fff,rgba(255,255,255,0)),conic-gradient(from 90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);box-shadow:0 0 0 1px var(--line2)}
.disc .mk{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px #000a,0 2px 6px #000a}
.sws{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sws i{width:18px;height:18px;border-radius:50%;background:var(--s);box-shadow:0 0 0 1px var(--line2)}

/* timeline */
.t-timeline .lab{display:none}
.tl{position:absolute;inset:0;display:flex;flex-direction:column}
.tl-head{display:flex;align-items:center;gap:10px;padding:6px 8px;min-width:0}
.tl-name{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.tl-tr{display:flex;gap:4px}
.tl-tr button{width:30px;height:28px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:0}
.tl-tr button svg{width:13px;height:13px;fill:var(--fg)}
.tl-tr button.on{background:color-mix(in srgb,var(--c) 30%,var(--panel2));border-color:var(--c)}
.tl-tc{font-family:var(--mono);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tl-cue{display:flex;gap:6px;align-items:baseline;min-width:0;overflow:hidden}
.tl-cue .k{font-family:var(--mono);font-size:10px;color:var(--dim)}
.tl-cue b{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-bpm{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap}
.tl-lane{flex:1;position:relative;margin:0 8px 8px;min-height:0;border:1px solid var(--line);border-radius:5px;background:var(--bg);overflow:hidden;cursor:ew-resize}
.tl-ruler{position:absolute;left:0;right:0;top:0;height:16px;border-bottom:1px solid var(--line)}
.tl-ruler span{position:absolute;top:2px;font-family:var(--mono);font-size:9.5px;color:var(--dim);padding-left:3px;border-left:1px solid var(--line2);height:12px;line-height:11px}
.tl-cues{position:absolute;left:0;right:0;top:17px;bottom:0}
.tl-blk{position:absolute;top:4px;bottom:4px;border-radius:3px;background:color-mix(in srgb,var(--ic) 18%,transparent);border-left:2px solid var(--ic);overflow:hidden;padding:3px 5px;box-sizing:border-box}
.tl-blk span{display:block;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;color:var(--fg)}
.tl-blk em{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.tl-blk.cur{background:color-mix(in srgb,var(--ic) 38%,transparent)}
.tl-ph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--fg);box-shadow:0 0 8px #fff8;pointer-events:none}
.tl-ph::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top:7px solid var(--fg)}

/* orologio */
.t-clock .box{container-type:size}
.clk{position:absolute;inset:24px 10px 8px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.clk-main{font-family:var(--mono);font-weight:600;font-size:min(46cqh,11cqw);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.clk-sub{font-family:var(--mono);font-size:min(13cqh,11px);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-clock.warn .clk-main{color:var(--accent)}
.t-clock.over .clk-main{color:var(--bad)}
.t-clock.live .clk-main{color:var(--c)}

/* render palco */
.t-stage .box{background:#05060a}
.t-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.seg{position:absolute;top:6px;right:6px;display:flex;background:#0009;border:1px solid var(--line2);border-radius:6px;padding:2px;z-index:3}
.seg button{background:none;border:0;border-radius:4px;padding:3px 9px;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--fg)}
.hud{position:absolute;left:9px;bottom:7px;font-family:var(--mono);font-size:10.5px;color:#c9ced8;text-shadow:0 1px 2px #000;pointer-events:none;z-index:2;white-space:nowrap}
.hud b{color:var(--accent);font-weight:600}

/* modifica */
.editing .w{cursor:grab}
.editing .w .box>*:not(.addr):not(.lab){pointer-events:none}
.w.sel .box{outline:2px solid var(--accent);outline-offset:-1px}
.rs{display:none;position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;z-index:5}
.rs::after{content:"";position:absolute;right:6px;bottom:6px;width:10px;height:10px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent)}
.w.sel .rs{display:block}

/* ---------- ispettore ---------- */
.insp{width:280px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;touch-action:auto;user-select:text;box-sizing:border-box}
.insp h3,.sheet h3{margin:0;font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:16px}
.insp label,.sheet label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--dim);letter-spacing:.04em}
.insp label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:13px}
.btn:disabled{opacity:.35;cursor:default}
.insp input,.insp select,.insp textarea,.sheet input,.sheet select,.sheet textarea{background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:7px 9px;font-size:14px;min-width:0;width:100%;box-sizing:border-box}
.insp input[type=checkbox]{width:auto;accent-color:var(--accent)}
.insp textarea{font-family:var(--mono);font-size:12px;min-height:110px;resize:vertical}
.mono{font-family:var(--mono)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.swb{width:28px;height:28px;border-radius:6px;background:var(--c);border:2px solid transparent}
.swb[aria-pressed="true"]{border-color:var(--fg)}
.hint{margin:0;font-size:13px;color:var(--dim);line-height:1.45}
.hint code{font-family:var(--mono);font-size:12px;color:var(--fg)}

/* ---------- monitor ---------- */
.mon{display:flex;gap:18px;align-items:center;padding-block:8px;font-family:var(--mono);font-size:12px;color:var(--dim);min-width:0}
.mcell{display:flex;gap:8px;min-width:0;align-items:center}
.mcell b{font-weight:600;font-size:10.5px;letter-spacing:.1em;padding:2px 5px;border-radius:3px;background:var(--panel2);color:var(--dim);flex:none}
.mcell.flash b{background:var(--accent);color:#1a1205}
.mcell span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.rate{margin-left:auto;flex:none}

/* ---------- pannello impostazioni ---------- */
.scrim{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:20;padding:16px}
.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:10px;width:min(620px,100%);max-height:100%;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;touch-action:auto;user-select:text;box-sizing:border-box}
.sheet textarea{height:160px;font-family:var(--mono);font-size:12px;resize:vertical}
.sheet section{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.sheet .top{display:flex;justify-content:space-between;align-items:center}
.three{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.note{font-size:12.5px;color:var(--dim);margin:0;line-height:1.45}
.note code{font-family:var(--mono);color:var(--fg)}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.tpl{border:1px solid var(--line2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--panel2)}
.tpl b{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.tpl p{margin:0;font-size:12.5px;color:var(--dim);line-height:1.4;flex:1}

/* widget Gaia: device TD, PatchDeck, DMX di stanza, agent */
.t-gaia .lab,.t-patchdeck .lab,.t-tddevice .lab,.t-gaiadmx .lab{display:none}
.gw{position:absolute;inset:0;display:flex;flex-direction:column;gap:7px;padding:7px 9px 9px}
.gw-h{display:flex;align-items:center;gap:8px;min-width:0}
.gw-n{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.gw-s{font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.dot.idle{background:var(--accent)}
.gw-btn{background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:5px 11px;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.gw-btn.on{background:color-mix(in srgb,var(--c) 30%,var(--panel2));border-color:var(--c)}
.pd-grid{flex:1;display:grid;gap:4px;min-height:0;grid-auto-rows:minmax(0,1fr)}
.pd-c{border:1px solid var(--line2);border-radius:4px;background:var(--panel2);display:grid;place-items:center;font-family:var(--mono);font-size:12.5px;color:var(--dim);min-height:0}
.pd-c.on{background:color-mix(in srgb,var(--c) 42%,var(--panel2));border-color:var(--c);color:#fff;box-shadow:0 0 12px color-mix(in srgb,var(--c) 45%,transparent)}
.pd-c.fl{outline:2px solid var(--fg);outline-offset:-2px}
.dv-body{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:7px;padding-right:2px}
.dv-svc{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:99px;padding:4px 11px;font-size:12px;font-family:var(--mono);color:var(--dim);white-space:nowrap}
.chip.on{border-color:var(--c);color:var(--fg);background:color-mix(in srgb,var(--c) 24%,var(--panel2))}
.dv-p{display:grid;grid-template-columns:minmax(64px,30%) minmax(0,1fr) 48px;gap:8px;align-items:center}
.dv-p>span:first-child{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-sl{position:relative;height:24px;border-radius:4px;background:var(--bg);border:1px solid var(--line2);overflow:hidden;touch-action:none;cursor:ew-resize}
.dv-sl i{position:absolute;left:0;top:0;bottom:0;width:0;background:color-mix(in srgb,var(--c) 45%,transparent);border-right:2px solid var(--c)}
.dv-v{font-family:var(--mono);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.dv-opts{display:flex;gap:4px;flex-wrap:wrap}
.dv-empty{margin:auto;text-align:center;color:var(--dim);font-size:13px;line-height:1.45;max-width:34ch}
.dz-pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:5px}
.dz-sw{border:1px solid var(--line2);border-radius:5px;padding:18px 7px 6px;background:linear-gradient(var(--s),var(--s)) top/100% 12px no-repeat,var(--panel2);font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dz-sw.on{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.dz-out{width:20px;height:20px;border-radius:50%;flex:none;--s:#000;background:var(--s);box-shadow:0 0 0 1px var(--line2),0 0 14px var(--s)}
.dz-meter{flex:1;min-width:60px;height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.dz-meter i{display:block;height:100%;width:0;background:var(--ok)}
.ga{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:14px;padding:12px}
.t-gaia{--mc:var(--accent)}
.t-gaia.narrow .ga{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
.ga-l{display:flex;flex-direction:column;gap:10px;min-height:0}
.ga-orbw{flex:1;min-height:110px;position:relative}
.ga-orbw canvas{position:absolute;inset:0;width:100%;height:100%}
.ga-mood{position:absolute;left:0;right:0;bottom:4px;text-align:center;pointer-events:none}
.ga-mood b{display:block;font-family:var(--display);font-weight:700;font-size:clamp(18px,2.4vw,30px);letter-spacing:.14em;text-transform:uppercase;color:var(--mc)}
.ga-mood span{font-family:var(--mono);font-size:11px;color:var(--dim)}
.ga-dims{display:flex;flex-direction:column;gap:6px}
.ga-dim{display:grid;grid-template-columns:76px minmax(0,1fr) 28px 28px;gap:6px;align-items:center}
.ga-dim span{font-size:12px;color:var(--dim)}
.ga-bar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.ga-bar i{display:block;height:100%;width:0;background:var(--mc);transition:width .4s}
.ga-dim button{height:26px;border-radius:4px;border:1px solid var(--line2);background:var(--panel2);font-family:var(--mono);font-size:14px;padding:0}
.ga-r{display:flex;flex-direction:column;gap:12px;min-height:0}
.ga-th .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--dim)}
.ga-th p{margin:5px 0 0;font-size:clamp(15px,1.7vw,21px);line-height:1.4;font-style:italic;text-wrap:pretty;max-width:52ch}
.ga-chat{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:7px;user-select:text;-webkit-user-select:text}
.msg{max-width:88%;padding:7px 11px;border-radius:9px;font-size:13.5px;line-height:1.4;background:var(--panel2);border:1px solid var(--line)}
.msg.gaia{align-self:flex-start;border-color:color-mix(in srgb,var(--mc) 50%,var(--line))}
.msg.tu{align-self:flex-end;background:color-mix(in srgb,var(--accent) 15%,var(--panel2))}
.msg.voce{align-self:flex-end;opacity:.75}
.msg em{display:block;font-style:normal;font-family:var(--mono);font-size:10px;color:var(--dim);margin-bottom:2px}
.ga-in{display:flex;gap:6px}
.ga-in input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:9px 11px;font-size:14px;user-select:text;-webkit-user-select:text}
.ga-in button{background:var(--mc);border:0;border-radius:6px;padding:0 16px;font-weight:600;color:#14110c}
.pill.sim i{background:var(--accent)}
.netg{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) 84px;gap:6px 8px;align-items:center}
.netg b{font-size:11px;color:var(--dim);font-weight:500;letter-spacing:.04em}
.netg>span{font-size:13px}.netg em{display:block;font-style:normal;font-size:11px;color:var(--dim)}
.nmut{font-size:12px!important;color:var(--dim);padding-left:4px}
.nett{display:flex;flex-direction:column;gap:5px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.nt{display:grid;grid-template-columns:10px 130px minmax(0,1fr);gap:8px;align-items:center;font-size:12.5px}
.nt i{width:8px;height:8px;border-radius:50%;background:var(--dim)}.nt.ok i{background:var(--ok)}.nt.ko i{background:var(--bad)}.nt.warn i{background:var(--accent)}
.nt span{font-family:var(--mono);font-size:11.5px;color:var(--dim);overflow-wrap:anywhere}
@media (max-width:520px){.netg{grid-template-columns:1fr 84px}.netg>span:not(.nmut){grid-column:1/-1;margin-top:4px}.netg>b{display:none}.nt{grid-template-columns:10px 1fr}.nt span{grid-column:2}}
.sheet label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:13px}
.sheet input[type=checkbox]{width:auto;accent-color:var(--accent)}

@media (max-width:760px){
  .insp{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:46%;border-radius:12px 12px 0 0;z-index:10;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .lab{font-size:12px}
  .mon .rate{display:none}
  .brand .txt{display:none}
  .tl-bpm,.tl-cue{display:none}
  .bar{flex-wrap:wrap}
  .tabs{order:9;flex-basis:100%}
  .pill{max-width:46%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
(()=>{
const COLS=16, ROWS=10;
const SWATCH=['#ffb23e','#3ec9ff','#ff5fa2','#9be15d','#b18cff','#e9ebef'];
const DEF={fader:[2,5],knob:[2,2],button:[2,2],xy:[4,4],meter:[1,5],label:[4,1],scenes:[4,3],color:[4,4],timeline:[10,3],clock:[4,2],stage:[8,6],gaia:[10,8],patchdeck:[8,6],tddevice:[8,4],gaiadmx:[6,6]};
const NAMES={fader:'Fader',knob:'Manopola',button:'Pulsante',xy:'Pad XY',meter:'Indicatore',label:'Testo',scenes:'Scene',color:'Colore',timeline:'Timeline',clock:'Orologio',stage:'Palco',gaia:'Gaia',patchdeck:'PatchDeck',tddevice:'Device TD',gaiadmx:'DMX stanza'};
const KEY='plancia.layout.v3', CKEY='plancia.conn.v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const hsv2rgb=(h,s,v=1)=>{const f=n=>{const k=(n+h*6)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};return[f(5),f(3),f(1)]};
const rgb2hsv=(r,g,b)=>{const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6;if(h<0)h+=1}return[h,mx?d/mx:0,mx]};
const hex=c=>'#'+c.map(v=>Math.round(clamp(v)*255).toString(16).padStart(2,'0')).join('');
const rgba=(c,a=1,k=1)=>`rgba(${Math.min(255,c[0]*k*255)|0},${Math.min(255,c[1]*k*255)|0},${Math.min(255,c[2]*k*255)|0},${clamp(a)})`;
const hash=(a,b)=>{const x=Math.sin(a*127.1+b*311.7)*43758.5453;return x-Math.floor(x)};
const now=()=>performance.now();

/* ---------- vocabolario dello show ---------- */
const LOOKS=[
 {n:'Walk-in',   wash:[.15,.22,.55],back:[.12,.1,.45],bar:[.2,.25,.7], mh:{dim:.35,col:[.45,.55,1],pos:4,gobo:3,zoom:.3},  wall:{col:[.1,.2,.6],mode:2}},
 {n:'Intro',     wash:[.02,.05,.22],back:[0,.25,.6],  bar:[0,.12,.45], mh:{dim:.65,col:[.25,.55,1],pos:3,gobo:0,zoom:.12}, wall:{col:[0,.3,.85],mode:2}},
 {n:'Strofa',    wash:[1,.55,.22], back:[.85,.32,.05],bar:[1,.42,.1],  mh:{dim:.5,col:[1,.72,.42],pos:2,gobo:2,zoom:.35},  wall:{col:[1,.5,.15],mode:1}},
 {n:'Pre-chorus',wash:[.9,.2,.42], back:[.55,0,.65], bar:[1,.1,.55],  mh:{dim:.8,col:[1,.22,.62],pos:0,gobo:1,zoom:.22},  wall:{col:[.95,.1,.55],mode:2}},
 {n:'Ritornello',wash:[1,.92,.82], back:[1,.1,.62],  bar:[1,0,.72],   mh:{dim:1,col:[1,1,1],pos:5,gobo:0,zoom:.18},       wall:{col:[1,.2,.7],mode:1}},
 {n:'Drop',      wash:[.1,.9,1],   back:[0,.4,1],    bar:[0,1,1],     mh:{dim:1,col:[.3,1,1],pos:5,gobo:4,zoom:.1},       wall:{col:[0,.9,1],mode:3}},
 {n:'Breakdown', wash:[.1,0,.3],   back:[.32,0,.85], bar:[.42,0,1],   mh:{dim:.55,col:[.62,.22,1],pos:3,gobo:5,zoom:.4},  wall:{col:[.5,0,1],mode:2}},
 {n:'Ballata',   wash:[.9,.6,.35], back:[.12,.05,.02],bar:[0,0,0],     mh:{dim:.9,col:[1,.86,.66],pos:2,gobo:0,zoom:.1,only:1},wall:{col:[.3,.15,.05],mode:0}},
 {n:'Solo',      wash:[.6,0,0],    back:[1,.22,0],   bar:[1,.12,0],   mh:{dim:1,col:[1,.3,.05],pos:4,gobo:3,zoom:.2},     wall:{col:[1,.2,0],mode:3}},
 {n:'Finale',    wash:[1,1,1],     back:[1,.6,0],    bar:[1,1,1],     mh:{dim:1,col:[1,.9,.5],pos:1,gobo:4,zoom:.3},      wall:{col:[1,.8,.2],mode:5}},
 {n:'Applausi',  wash:[1,.85,.7],  back:[.5,.4,.9],  bar:[.8,.6,1],   mh:{dim:.7,col:[1,1,1],pos:1,gobo:0,zoom:.6},       wall:{col:[.7,.5,1],mode:5}},
 {n:'Buio',      wash:[0,0,0],     back:[0,0,0],     bar:[0,0,0],     mh:{dim:0,col:[1,1,1],pos:0,gobo:0,zoom:.2},        wall:{col:[0,0,0],mode:0}},
];
const POS=['Centro','Pubblico','Palco','Cielo','Croce','Ventaglio'];
const GOBOS=['Open','Dots','Ring','Breakup','Prisma','Star'];
const CHASE=['Off','Lento','Veloce','Rainbow','Random','Sound'];
const LEDM=['Tinta','Gradiente','Onde','Pixel','Strobo','Logo'];
const SWC=[[1,1,1],[1,.05,.05],[1,.45,0],[1,.78,.3],[.1,1,.25],[0,.85,1],[.1,.2,1],[1,0,.8],[.45,0,1]];
const TLCUES=`0:00 Walk-in > 1
0:12 Intro > 2
0:40 Strofa > 3
1:10 Pre-chorus > 4
1:24 Ritornello > 5
1:52 Drop > 6
2:20 Breakdown > 7
2:44 Ballata > 8
3:15 Solo > 9
3:45 Finale > 10
4:15 Applausi > 11
4:28 Buio > 12`;
const RIG={heads:8,uplights:6,bars:8,wall:true,speakers:true};

/* ---------- template ---------- */
function W(type,x,y,w,h,o={}){return Object.assign({id:uid(),type,x,y,w,h,label:NAMES[type],addr:'',min:0,max:1,color:SWATCH[0],value:0,valueY:.5,mode:'push',midi:{ch:1,cc:''}},o)}
const P=(name,widgets)=>({id:uid(),name,widgets});
const sceneList=LOOKS.map(l=>l.n).join('\n');
const tlOpts=()=>({addr:'/show',duration:270,bpm:124,cues:TLCUES,color:SWATCH[0]});
const TPL={
  show:{name:'Panoramica show',desc:'Render del palco, orologi, scene, timeline e master in una schermata.',pages:()=>[P('Show',[
    W('stage',0,0,11,7,{label:'Palco',view:'render'}),
    W('clock',11,0,5,2,{label:'Ora',mode:'tod',color:SWATCH[5]}),
    W('clock',11,2,5,2,{label:'Show',mode:'show',color:SWATCH[0]}),
    W('scenes',11,4,5,3,{label:'Scene',addr:'/dmx/scene',items:sceneList,cols:4,value:0}),
    W('timeline',0,7,11,3,{label:'Timeline',...tlOpts()}),
    W('fader',11,7,2,3,{label:'Master',addr:'/dmx/master',value:1}),
    W('button',13,7,3,2,{label:'Blackout',addr:'/dmx/blackout',mode:'toggle',color:SWATCH[2]}),
    W('button',13,9,3,1,{label:'Flash strobo',addr:'/dmx/strobe',color:SWATCH[5]})
  ])]},
  dmx:{name:'Luci DMX',desc:'12 scene con crossfade, chase, blackout, strobo e fader di gruppo.',pages:()=>[P('DMX',[
    W('scenes',0,0,8,5,{label:'Scene',addr:'/dmx/scene',items:sceneList,cols:4,value:0}),
    W('scenes',8,0,4,3,{label:'Chase',addr:'/dmx/chase',items:CHASE.join('\n'),cols:2,value:0,color:SWATCH[4]}),
    W('button',12,0,2,3,{label:'Blackout',addr:'/dmx/blackout',mode:'toggle',color:SWATCH[2]}),
    W('button',14,0,2,3,{label:'Strobo',addr:'/dmx/strobe',mode:'toggle',color:SWATCH[5]}),
    W('fader',8,3,4,2,{label:'Fade (s)',addr:'/dmx/fade',min:0,max:10,value:.15,color:SWATCH[1]}),
    W('fader',12,3,4,2,{label:'Strobo (Hz)',addr:'/dmx/strobe/rate',min:1,max:20,value:.37,color:SWATCH[5]}),
    ...[['Master','master',1,0],['Front','group/front',.85,0],['Back','group/back',.9,4],['Teste','group/mh',1,1],['LED bar','group/ledbar',.8,2],['LED wall','group/ledwall',.9,2],['Haze','group/haze',.55,5],['Blinder','group/blinder',0,5]]
      .map(([n,a,v,c],i)=>W('fader',i*2,5,2,5,{label:n,addr:'/dmx/'+a,value:v,color:SWATCH[c]}))
  ])]},
  mh:{name:'Teste mobili',desc:'Selezione fixture, pan/tilt, colore, gobo, posizioni preset, dimmer e zoom.',pages:()=>[P('Teste mobili',[
    W('scenes',0,0,8,2,{label:'Selezione',addr:'/mh/select',mode:'multi',items:[1,2,3,4,5,6,7,8].map(n=>'MH '+n).join('\n'),cols:8,value:[1,1,1,1,1,1,1,1],color:SWATCH[1]}),
    W('scenes',8,0,8,2,{label:'Posizioni',addr:'/mh/position',items:POS.join('\n'),cols:6,value:-1}),
    W('xy',0,2,6,8,{label:'Pan / Tilt',addr:'/mh/pantilt',min:-1,max:1,value:.5,valueY:.25,color:SWATCH[1]}),
    W('color',6,2,4,5,{label:'Colore',addr:'/mh/color',value:{h:.58,s:.55},color:SWATCH[1]}),
    W('scenes',6,7,4,3,{label:'Gobo',addr:'/mh/gobo',items:GOBOS.join('\n'),cols:3,value:0,color:SWATCH[3]}),
    W('fader',10,2,2,5,{label:'Dimmer',addr:'/mh/dimmer',value:1}),
    W('fader',12,2,2,5,{label:'Zoom',addr:'/mh/zoom',value:.3,color:SWATCH[4]}),
    W('fader',14,2,2,5,{label:'Focus',addr:'/mh/focus',value:.7,color:SWATCH[4]}),
    W('button',10,7,3,3,{label:'Strobo MH',addr:'/mh/strobe',mode:'toggle',color:SWATCH[5]}),
    W('button',13,7,3,3,{label:'Home',addr:'/mh/home',color:SWATCH[2]})
  ])]},
  timeline:{name:'Timeline e clock',desc:'Cue list a tempo, timecode 25 fps, countdown a fine show, GO e Back.',pages:()=>[P('Timeline',[
    W('timeline',0,0,16,5,{label:'Timeline',...tlOpts()}),
    W('clock',0,5,6,2,{label:'Timecode',mode:'show',color:SWATCH[0]}),
    W('clock',6,5,5,2,{label:'Fine show',mode:'countdown',target:'23:30',color:SWATCH[1]}),
    W('clock',11,5,5,2,{label:'Ora',mode:'tod',color:SWATCH[5]}),
    W('button',0,7,4,3,{label:'GO',addr:'/show/go',color:SWATCH[3]}),
    W('button',4,7,2,3,{label:'Back',addr:'/show/back',color:SWATCH[5]}),
    W('scenes',6,7,10,3,{label:'Scena attiva',addr:'/dmx/scene',items:sceneList,cols:6,value:0})
  ])]},
  palco:{name:'Design palco',desc:'Pianta del rig con patch DMX, render live, contenuti LED wall e blinder.',pages:()=>[P('Palco',[
    W('stage',0,0,12,10,{label:'Design',view:'plot'}),
    W('color',12,0,4,4,{label:'LED wall',addr:'/led/color',value:{h:.9,s:.8},color:SWATCH[2]}),
    W('scenes',12,4,4,3,{label:'Contenuto LED',addr:'/led/mode',items:LEDM.join('\n'),cols:2,value:1,color:SWATCH[2]}),
    W('fader',12,7,2,3,{label:'LED',addr:'/led/bright',value:.9,color:SWATCH[2]}),
    W('fader',14,7,2,3,{label:'Blinder',addr:'/dmx/group/blinder',value:0,color:SWATCH[5]})
  ])]},
  mix:{name:'Mixer live',desc:'Fader canali con CC MIDI, meter, effetti, pad XY e scene.',pages:()=>{const mix=['Drums','Bass','Piano','Synth'];return[P('Mix',[
    ...mix.map((n,i)=>W('fader',i*2,0,2,6,{label:n,addr:'/mix/'+n.toLowerCase(),color:SWATCH[i],value:[.82,.64,.5,.36][i],midi:{ch:1,cc:String(20+i)}})),
    W('meter',8,0,1,6,{label:'L',addr:'/meter/l',color:SWATCH[3],value:.58}),
    W('meter',9,0,1,6,{label:'R',addr:'/meter/r',color:SWATCH[3],value:.51}),
    W('knob',10,0,2,3,{label:'Reverb',addr:'/fx/reverb',color:SWATCH[4],value:.3}),

    W('xy',10,3,6,5,{label:'Filtro XY',addr:'/fx/xy',min:-1,max:1,color:SWATCH[1],value:.4,valueY:.62}),
    ...[1,2,3,4].map(n=>W('button',(n-1)*2,6,2,2,{label:'Clip '+n,addr:'/live/clip/'+n,color:SWATCH[0]})),
    W('button',8,6,2,2,{label:'Mute FX',addr:'/fx/mute',color:SWATCH[2],mode:'toggle'}),
    W('label',0,8,4,2,{label:'Master',color:SWATCH[5]}),
    W('fader',4,8,12,2,{label:'Volume',addr:'/mix/master',color:SWATCH[5],value:.8})
  ])]}}
};
TPL.gaia={name:'Gaia live',desc:'Agent Gaia (mood, pensieri, chat), PatchDeck V8 con FX, Controller V8, DMX V8 e luci di stanza via MQTT.',pages:()=>[
  P('Gaia',[W('gaia',0,0,10,10,{label:'Gaia'}),W('clock',10,0,6,2,{label:'Ora',mode:'tod',color:SWATCH[5]}),W('gaiadmx',10,2,6,8,{label:'Luci stanza',addr:''})]),
  P('PatchDeck',[W('patchdeck',0,0,8,6,{label:'Deck A',deck:'a',color:SWATCH[1]}),W('patchdeck',8,0,8,6,{label:'Deck B',deck:'b',color:SWATCH[2]}),
    W('tddevice',0,6,9,4,{label:'FX e servizi',fam:'patchdeck',color:SWATCH[1]}),W('tddevice',9,6,7,4,{label:'Controller',fam:'mixeraudio',color:SWATCH[3]})]),
  P('DMX V8',[W('tddevice',0,0,10,10,{label:'DMX V8',fam:'dmx',color:SWATCH[0]}),W('gaiadmx',10,0,6,10,{label:'DMX stanza',color:SWATCH[4]})])]};
TPL.full={name:'Show completo',desc:'Tutte le pagine insieme: Gaia, PatchDeck, DMX V8, panoramica show, DMX, teste mobili, timeline, palco, mix.',
  pages:()=>['gaia','show','dmx','mh','timeline','palco','mix'].flatMap(k=>TPL[k].pages())};

const mkT=v=>({f:v.slice(),t:v.slice(),c:v.slice(),t0:0,d:0});

function setI(T,i,v){T.f[i]=T.t[i]=T.c[i]=v}
function stepT(T,n){const k=T.d>0?clamp((n-T.t0)/(T.d*1000)):1,e=k*k*(3-2*k);for(let i=0;i<T.c.length;i++)T.c[i]=T.f[i]+(T.t[i]-T.f[i])*e}
const SH={master:1,fade:1.5,blackout:0,strobe:0,rate:8,chase:0,scene:-1,t0:0,
  g:{front:.85,back:.9,mh:1,ledbar:.8,ledwall:.9,haze:.55,blinder:0},
  led:{mode:1,bright:.9},sel:new Set([0,1,2,3,4,5,6,7]),
  wash:mkT([0,0,0]),back:mkT([0,0,0]),bar:mkT([0,0,0]),wall:mkT([0,0,0]),

function posOf(p,i,n){const u=n>1?i/(n-1)*2-1:0;
  switch(p){case 0:return[-u*.32,.62];case 1:return[u*.25,.98];case 2:return[-u*.12,.45];case 3:return[u*.45,-.75];case 4:return[i%2?.42:-.42,.55];case 5:return[u*.85,.5];default:return[0,.5]}}
function goScene(i,d=SH.fade){
  const l=LOOKS[i]; if(!l)return; SH.scene=i; SH.t0=now();
  goT(SH.wash,l.wash,d);goT(SH.back,l.back,d);goT(SH.bar,l.bar,d);goT(SH.wall,l.wall.col,d);SH.led.mode=l.wall.mode;

function model(a,args){

    case '/dmx/fade':SH.fade=v;break;

    case '/mh/pantilt':selHeads().forEach(h=>{setI(h.T,0,+args[0]);setI(h.T,1,-(+args[1]))});break;
    case '/mh/color':selHeads().forEach(h=>[0,1,2].forEach(j=>setI(h.T,2+j,+args[j])));break;
    case '/mh/dimmer':selHeads().forEach(h=>setI(h.T,5,v));break;
    case '/mh/zoom':selHeads().forEach(h=>setI(h.T,6,v));break;
    case '/mh/focus':selHeads().forEach(h=>setI(h.T,7,v));break;
    case '/mh/gobo':selHeads().forEach(h=>h.gobo=Math.round(v));break;
    case '/mh/strobe':selHeads().forEach(h=>h.strobe=v>.5);break;
    case '/mh/position':{const n=L.rig.heads;SH.heads.forEach((h,k)=>{if(!SH.sel.has(k))return;const [p,t]=posOf(Math.round(v),k,n);const tt=h.T.t.slice();tt[0]=p;tt[1]=t;goT(h.T,tt,.7)});break}

/* ---------- runtime timeline (condiviso per indirizzo) ---------- */
const RT={}; const cueCache=new Map();
const rt=w=>RT[w.addr]||(RT[w.addr]={t:0,playing:false,loop:false,cue:-1,last:0,sent:0});
function parseCues(w){
  const k=w.cues||''; if(cueCache.has(k))return cueCache.get(k);
  const r=k.split('\n').map(s=>s.match(/^\s*(\d+):(\d{1,2}(?:\.\d+)?)\s+(.*?)(?:\s*>\s*(\d+))?\s*$/)).filter(Boolean)
    .map(m=>({t:+m[1]*60+ +m[2],name:m[3]||'Cue',scene:m[4]!=null?+m[4]-1:null})).sort((a,b)=>a.t-b.t);
  cueCache.set(k,r); return r;
}
const cueAt=(cues,t)=>{let i=-1;cues.forEach((c,k)=>{if(c.t<=t+1e-6)i=k});return i};
function fireCue(w,i){const c=parseCues(w)[i];if(!c)return;fire(w.addr+'/cue',[i+1]);if(c.scene!=null)fire('/dmx/scene',[c.scene])}
function seek(w,t,quietCue){const r=rt(w),cues=parseCues(w);r.t=clamp(t,0,w.duration);const i=cueAt(cues,r.t);
  if(i!==r.cue){r.cue=i;if(!quietCue&&i>=0)fireCue(w,i)} fire(w.addr+'/time',[+r.t.toFixed(2)])}
function tlAct(w,act){const r=rt(w),cues=parseCues(w);
  if(act==='play'){r.playing=!r.playing;r.last=now();fire(w.addr+'/play',[r.playing?1:0]);if(r.playing&&r.cue<0&&cues[0]&&cues[0].t<=r.t){r.cue=0;fireCue(w,0)}}
  else if(act==='stop'){r.playing=false;r.t=0;r.cue=-1;fire(w.addr+'/play',[0]);fire(w.addr+'/time',[0])}
  else if(act==='start'){seek(w,0)}
  else if(act==='loop'){r.loop=!r.loop}
  else if(act==='go'){const i=Math.min(cues.length-1,r.cue+1);if(i>=0){r.t=cues[i].t;r.cue=i;fireCue(w,i)}}
  else if(act==='back'){const i=Math.max(0,r.cue-1);if(cues[i]){r.t=cues[i].t;r.cue=i;fireCue(w,i)}}
}
function timelineBus(a,args,src){
  const seen=new Set();
  for(const w of allW()){if(w.type!=='timeline'||seen.has(w.addr)||!a.startsWith(w.addr+'/'))continue;seen.add(w.addr);
    const s=a.slice(w.addr.length+1),v=+args[0];
    if((s==='go'||s==='back')&&v>.5)tlAct(w,s);
    else if(src==='remote'&&s==='play'){const r=rt(w);r.playing=v>.5;r.last=now()}
    else if(src==='remote'&&s==='time'){rt(w).t=clamp(v,0,w.duration)}
  }
}

/* ---------- invio OSC ---------- */
function argsOf(w){
  switch(w.type){
    case 'xy': return [out(w,w.value),out(w,w.valueY)];
    case 'button': return [w.value>.5?w.max:w.min];
    case 'scenes': return w.mode==='multi'?(w.value||[]).map(x=>+x?1:0):[w.value];
    case 'color': return colorRGB(w).map(x=>+x.toFixed(4));
    default: return [out(w,w.value)];
  }
}
const queue=new Map(); let raf=0;
function send(w){if(!w.addr)return; queue.set(w.id,w); if(!raf) raf=requestAnimationFrame(flush)}
function flush(){raf=0; for(const w of queue.values()){
  const m={type:'osc',address:w.addr,args:argsOf(w)};
  emit(m); applyWidgets(m,w.id);
  if(w.midi&&w.midi.cc!==''&&w.midi.cc!=null) emit({type:'midi',ch:+w.midi.ch||1,cc:+w.midi.cc,value:Math.round((typeof w.value==='number'?w.value:0)*127)},true);
} queue.clear()}
function set(w,v){if(w.value===v)return; w.value=v; paint(elOf(w.id),w); send(w)}
function setXY(w,x,y){w.value=x;w.valueY=y;paint(elOf(w.id),w);send(w)}
function fire(address,args){const m={type:'osc',address,args};emit(m);applyWidgets(m,null)}
function bus(a,args,src){model(a,args);timelineBus(a,args,src)}

/* ---------- interazione ---------- */
function bind(el,w){
  el.addEventListener('pointerdown',e=>{
    if(editing) return editDown(e,el,w);
    if(GAIA_TYPES.has(w.type)) return gBind(e,el,w);
    if(w.type==='label'||w.type==='meter'||w.type==='clock') return;
    const end=()=>{el.classList.remove('active','press');el.onpointermove=null;el.onpointerup=el.onpointercancel=null;save()};
    if(w.type==='stage'){const b=e.target.closest('[data-v]');if(b){w.view=b.dataset.v;el.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));save()}return}
    if(w.type==='timeline'){
      const b=e.target.closest('[data-act]'); if(b){e.preventDefault();tlAct(w,b.dataset.act);return}
      const lane=e.target.closest('.tl-lane'); if(!lane)return;
      e.preventDefault(); el.setPointerCapture(e.pointerId); const r=lane.getBoundingClientRect();
      const mv=ev=>seek(w,clamp((ev.clientX-r.left)/r.width)*w.duration); mv(e); el.onpointermove=mv; el.onpointerup=el.onpointercancel=end; return;
    }
    if(w.type==='scenes'){
      const it=e.target.closest('[data-i]'); if(!it)return; e.preventDefault(); const i=+it.dataset.i;
      if(w.mode==='multi'){const a=items(w).map((_,k)=>Array.isArray(w.value)?(+w.value[k]||0):0);a[i]=a[i]?0:1;w.value=a;paint(el,w);send(w)}
      else{w.value=-2;set(w,i)}
      save(); return;
    }
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    if(w.type==='color'){
      const sw=e.target.closest('[data-s]');
      if(sw){const [h,s]=rgb2hsv(...SWC[+sw.dataset.s]);w.value={h,s};paint(el,w);send(w);save();return}
      const disc=el.querySelector('.disc'),r=disc.getBoundingClientRect();
      const mv=ev=>{const dx=(ev.clientX-r.left)/r.width*2-1,dy=(ev.clientY-r.top)/r.height*2-1;
        w.value={h:((Math.atan2(dy,dx)/(2*Math.PI))+1)%1,s:clamp(Math.hypot(dx,dy))};paint(el,w);send(w)};
      el.classList.add('active'); mv(e); el.onpointermove=mv; el.onpointerup=el.onpointercancel=end; return;
    }
    const r=el.querySelector('.box').getBoundingClientRect();
    if(w.type==='button'){
      el.classList.add('press');
      set(w, w.mode==='toggle' ? (w.value>.5?0:1) : 1);
      el.onpointerup=el.onpointercancel=()=>{if(w.mode!=='toggle')set(w,0);end()};
      return;
    }
    const s={x:e.clientX,y:e.clientY,v:w.value};
    const move=ev=>{
      if(w.type==='fader'){const hz=w.w>w.h; set(w,clamp(hz?(ev.clientX-r.left)/r.width:1-(ev.clientY-r.top)/r.height))}
      else if(w.type==='knob'){set(w,clamp(s.v+((s.y-ev.clientY)+(ev.clientX-s.x)*.5)/220))}
      else if(w.type==='xy'){setXY(w,clamp((ev.clientX-r.left)/r.width),clamp(1-(ev.clientY-r.top)/r.height))}
    };
    el.classList.add('active'); if(w.type!=='knob') move(e);
    el.onpointermove=move; el.onpointerup=el.onpointercancel=end;
  });
}
function editDown(e,el,w){

/* parametri di un device: matrice reale se c'è (fx_params PatchDeck, dmx_matrix piatta o multi-rig), altrimenti i valori in status */
function devParams(id){
  const d=G.devices[id]||{},out=[],seen=new Set();
  const fx=G.pdm[id]?.fx_params||{};
  for(const[n,m]of Object.entries(fx)){seen.add(n);out.push({n,label:m.label||n.replace(/_/g,' '),min:typeof m.min==='number'?m.min:0,max:typeof m.max==='number'?m.max:1})}
  const dm=G.dxm[id];
  const addDx=(params,rig)=>{for(const[n0,m]of Object.entries(params||{})){const n=rig?n0.replace(/^dmx_/,`dmx_${rig}_`):n0;if(seen.has(n))continue;seen.add(n);
    const lab=(rig?rig.toUpperCase()+' · ':'')+n0.replace(/^dmx_/,'').replace(/_/g,' ');
    if(Array.isArray(m.options))out.push({n,label:lab,options:m.options});
    else if(m.type==='bool'||m.type==='toggle')out.push({n,label:lab,options:[0,1],labels:['off','on']});
    else{const r=m.range||[m.min??0,m.max??1];out.push({n,label:lab,min:+r[0],max:+r[1]})}}};
  if(dm?.rigs)for(const[rig,r]of Object.entries(dm.rigs))addDx(r.params,rig);else if(dm)addDx(dm.params,null);
  for(const[n,v]of Object.entries(d.params||{}))if(!seen.has(n)&&typeof v==='number'){seen.add(n);out.push({n,label:n.replace(/_/g,' '),min:0,max:Math.max(1,Math.abs(v)>1?Math.ceil(Math.abs(v)):1)})}
  return out;
}
function devServices(id){
  const d=G.devices[id]||{},pm=G.pdm[id]?.services||{},dm=G.dxm[id];
  let keys=Object.keys(d.services||{});
  if(dm?.rigs)for(const[rig,r]of Object.entries(dm.rigs))for(const k of Object.keys(r.services||{}))keys.push(k.replace(/^dmx_/,`dmx_${rig}_`));
  else if(dm?.services)keys.push(...Object.keys(dm.services));
  return[...new Set(keys)].filter(k=>!['load_patch','deck_toggle'].includes(pm[k]?.kind)).sort();
}

function gOrb(el,t){
  const c=el.querySelector('.ga-orbw canvas');if(!c||!c._d)return;const g=c.getContext('2d');g.setTransform(c._d,0,0,c._d,0,0);
  const W=c.width/c._d,H=c.height/c._d,m=moodOf(),e=clamp((+m.s.energy||50)/100),R=Math.min(W,H)*.36,cx=W/2,cy=H*.44;
  g.clearRect(0,0,W,H);g.globalCompositeOperation='lighter';
  const sp=m.key==='stress'?.0028:m.key==='calm'?.0009:.0016,br=1+.06*Math.sin(t*sp*2);
  glow(g,cx,cy,R*2.1*br,m.rgb,.28+.25*e);
  for(let i=0;i<5;i++){const r=R*(.55+i*.16)*br,a=t*sp*(i%2?1:-1)*(1+i*.2);g.strokeStyle=rgba(m.rgb,.5-i*.08);g.lineWidth=1.2;
    g.beginPath();for(let k=0;k<=64;k++){const th=k/64*Math.PI*2,rr=r*(1+.05*Math.sin(th*(3+i)+a*3));const x=cx+Math.cos(th)*rr,y=cy+Math.sin(th)*rr;k?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}
  glow(g,cx,cy,R*.55,[1,1,1],.35);glow(g,cx,cy,R*.9,m.rgb,.7);g.globalCompositeOperation='source-over';
}

/* verifica raggiungibilità: MQTT con una connessione di prova, HTTP con fetch no-cors (risponde = raggiungibile) */
async function netTest(n){
  const out=$('#gTestOut');out.hidden=false;
  const row=(k,st,txt)=>`<div class="nt ${st}"><i></i><b>${k}</b><span>${esc(txt)}</span></div>`;
  const res={mqtt:['…','prova in corso'],fb:null,nr:['…','prova in corso'],nrws:['…','prova in corso'],ad:['…','prova in corso']};
  const draw=()=>{out.innerHTML=row('Broker MQTT',...res.mqtt)+(res.fb?row('Fallback',...res.fb):'')+row('Node-RED HTTP',...res.nr)+row('Node-RED WS /gaia',...res.nrws)+row('Gaia Admin',...res.ad)+
    row('OSC → Gaia',ws&&ws.readyState===1?'ok':'warn',ws&&ws.readyState===1?`il bridge di Plancia invia a ${n.osc}:${n.oscPort} (UDP, senza conferma)`:`serve il bridge di Plancia per mandare OSC a ${n.osc}:${n.oscPort}`)};
  draw();
  if(location.protocol==='https:'){const m='da una pagina https il browser blocca ws:// e http:// verso la LAN: apri Plancia dal bridge';res.mqtt=res.nr=res.nrws=res.ad=['ko',m];draw();return}
  const http=(h,p)=>new Promise(r=>{if(!h)return r(['warn','non impostato']);const c=new AbortController(),t=setTimeout(()=>{c.abort();r(['ko',`${h}:${p} non risponde`])},3500);
    fetch(`http://${h}:${p}/`,{mode:'no-cors',signal:c.signal}).then(()=>{clearTimeout(t);r(['ok',`${h}:${p} raggiungibile`])},()=>{clearTimeout(t);r(['ko',`${h}:${p} non raggiungibile`])})});
  const wsT=(url)=>new Promise(r=>{let w;try{w=new WebSocket(url)}catch{return r(['ko','indirizzo non valido'])}const t=setTimeout(()=>{try{w.close()}catch{}r(['ko','nessuna risposta'])},3500);
    w.onopen=()=>{clearTimeout(t);w.close();r(['ok',url+' aperto'])};w.onerror=()=>{clearTimeout(t);r(['ko',url+' rifiutato'])}});
  const mq=h=>new Promise(r=>{if(!h)return r(null);if(!window.mqtt)return r(['warn','libreria MQTT non caricata']);
    let c;try{c=mqtt.connect(`ws://${h}:${n.wsPort}`,{connectTimeout:3500,reconnectPeriod:0})}catch{return r(['ko','indirizzo non valido'])}
    const done=v=>{try{c.end(true)}catch{}r(v)};c.on('connect',()=>done(['ok',`${h}:${n.wsPort} connesso`]));c.on('error',()=>done(['ko',`${h}:${n.wsPort} rifiutato`]));setTimeout(()=>done(['ko',`${h}:${n.wsPort} nessuna risposta`]),4000)});
  [res.mqtt,res.fb,res.nr,res.nrws,res.ad]=await Promise.all([mq(n.broker),mq(n.fallback),http(n.nodered,n.noderedPort),n.nodered?wsT(`ws://${n.nodered}:${n.noderedPort}/gaia`):Promise.resolve(['warn','non impostato']),http(n.admin,n.adminPort)]);
  draw();
}

  const pr={Warm:[255,160,60],Cool:[60,140,255],Fire:[255,60,0],Ocean:[0,120,180],Forest:[20,160,60],Sunset:[255,90,40],Magenta:[220,0,180],White:[255,255,255],Off:[0,0,0]};
  G.dmx.ingresso={device_id:'pi-dmx-ingresso',stanza:'ingresso',artnet_configured:true,palettes:Object.keys(pr),palettes_rgb:pr,timeline_presets:{Arcobaleno:{},Lampeggio:{},Respiro:{}},default_fixture:'par1',
    fixtures:{par1:{current_palette:'Warm',output_rgb:[255,160,60],brightness:.8,audio_reactive:false,timeline_running:false,current_timeline_preset:null}},audio_level:.2,ts:t};
  G.canvas={soul:{mood:'curiosity',mood_rgb:{r:190,g:135,b:255},stress:.18,calm:.52,social:.41,curiosity:.72,energy:64,lifeIndex:78},thought:SIM_THOUGHTS[0]};
  G.chat=[{who:'gaia',text:'Buonasera. Sono in simulazione: collegami al broker di Core per parlare davvero.',room:'studio',ts:t-90000}];G.chatV++;
  gStatus();G.dirty=true;
}
function gSimOff(){G.sim=false;G.devices={};G.pdm={};G.dxm={};G.dmx={};G.canvas=null;G.brain=null;G.chat=[];G.chatV++;G.dirty=true}
function simMood(){const s=G.canvas.soul,k=['stress','calm','social','curiosity'].reduce((a,b)=>(s[b]>s[a]?b:a));s.mood=k;const c=MOOD_INKS[k];s.mood_rgb={r:c[0],g:c[1],b:c[2]}}
function simCmd(topic,o){
  let m=topic.match(/^gaia\/device\/([^/]+)\/command$/);
  if(m){const id=m[1],d=G.devices[id];if(!d)return;
    if(o.action==='set')(d.params=d.params||{})[o.param]=o.value;
    else if(o.action==='enable'||o.action==='disable'){const pm=G.pdm[id]?.services||{},k=pm[o.service];
      if(k?.kind==='load_patch'&&o.action==='enable')for(const[x,s]of Object.entries(pm))if(s.kind==='load_patch'&&s.deck===k.deck)d.services[x]='inactive';
      d.services[o.service]=o.action==='enable'?'active':'inactive'}
    d.ts=Date.now();return}
  m=topic.match(/^gaia\/dmx\/([^/]+)\/command$/);
  if(m){const s=G.dmx[m[1]],f=s?.fixtures[o.fixture||s.default_fixture];if(!f)return;
    switch(o.action){case 'set_palette':f.current_palette=o.palette;f.output_rgb=s.palettes_rgb[o.palette];f.timeline_running=false;break;
      case 'blackout':f.output_rgb=[0,0,0];f.current_palette=null;f.timeline_running=false;break;
      case 'set_brightness':f.brightness=o.value;break;case 'timeline_load':f.current_timeline_preset=o.name;break;
      case 'timeline_start':f.timeline_running=true;break;case 'timeline_stop':f.timeline_running=false;break;
      case 'audio_reactive_start':f.audio_reactive=true;break;case 'audio_reactive_stop':f.audio_reactive=false;break}
    s.ts=Date.now();return}
  if(topic.startsWith('gaia/touchdesigner/mood/')&&G.canvas){const k=topic.split('/').pop(),s=G.canvas.soul;s[k]=clamp((+s[k]||0)+(+o),0,k==='energy'?100:1);simMood();return}
  if(topic.startsWith('gaia/voice/command/'))setTimeout(()=>{if(!G.sim)return;gChat('gaia',`Ho sentito «${o.text}». In simulazione non posso risponderti davvero: collegami al broker di Core.`,GC.stanza)},1100);
}
let simT=0;
function simTick(n){
  if(!G.sim||n-simT<1000)return;simT=n;const s=G.dmx.ingresso;
  if(s){s.audio_level=clamp(.25+.5*Math.random()*(Math.sin(n/700)+1)/2);const f=s.fixtures.par1;
    if(f.timeline_running){const names=Object.keys(s.palettes_rgb).filter(x=>x!=='Off');const nm=names[Math.floor(n/2500)%names.length];f.output_rgb=s.palettes_rgb[nm];f.current_palette=null}}
  if(G.canvas&&Math.floor(n/15000)!==G.canvas._k){G.canvas._k=Math.floor(n/15000);G.canvas.thought=SIM_THOUGHTS[G.canvas._k%SIM_THOUGHTS.length]}
  G.dirty=true;
}

/* ---------- ciclo principale ---------- */
const tc=s=>{const f=Math.floor((s%1)*25),S=Math.floor(s);return[Math.floor(S/3600),Math.floor(S/60)%60,S%60,f].map(v=>String(v).padStart(2,'0')).join(':')};
let lastT=now();
function loop(){
  const n=now(),dt=(n-lastT)/1000;lastT=n;
  [SH.wash,SH.back,SH.bar,SH.wall].forEach(T=>stepT(T,n));SH.heads.forEach(h=>stepT(h.T,n));
  // timeline
  const seen=new Set();showPlaying=false;
  for(const w of allW()){if(w.type!=='timeline'||seen.has(w.addr))continue;seen.add(w.addr);const r=rt(w),cues=parseCues(w);
    if(r.playing){r.t+=dt;if(r.t>=w.duration){if(r.loop){r.t=0;r.cue=-1}else{r.t=w.duration;r.playing=false;fire(w.addr+'/play',[0])}}
      const i=cueAt(cues,r.t);if(i!==r.cue){r.cue=i;if(i>=0)fireCue(w,i)}
      if(n-r.sent>100){r.sent=n;fire(w.addr+'/time',[+r.t.toFixed(2)])}
      showPlaying=true;showBpm=w.bpm||120}
    if(r.playing||seen.size===1)showT=r.t}
  const beat=(n/60000*showBpm)%1, level=showPlaying?.45+.55*Math.exp(-beat*5):.12+.05*Math.sin(n*.002);
  simTick(n);const gp=G.dirty||n-G.lastPaint>1000;if(gp){G.dirty=false;G.lastPaint=n}
  const byId=new Map(page().widgets.map(w=>[w.id,w]));
  for(const el of stage.children){const w=byId.get(el.dataset.id);if(!w)continue;
    if(GAIA_TYPES.has(w.type)){if(gp)gPaint(el,w);if(w.type==='gaia')gOrb(el,n)}
    else if(w.type==='stage'){const c=el.querySelector('canvas'),g=c.getContext('2d');if(!c._d)continue;g.setTransform(c._d,0,0,c._d,0,0);
      const W=c.width/c._d,H=c.height/c._d;(w.view==='plot'?drawPlot:drawRender)(g,W,H,n,level);
      const hud=w.view==='plot'?'':`${SH.blackout?'<b>BLACKOUT</b> · ':''}SC ${SH.scene+1} ${esc(LOOKS[SH.scene]?.n||'')} · fade ${SH.fade.toFixed(1)}s · chase ${CHASE[SH.chase]||'Off'}${SH.strobe?' · <b>STROBO</b>':''}`;
      const h=el.querySelector('.hud');if(h._v!==hud){h.innerHTML=hud;h._v=hud}}
    else if(w.type==='timeline'){const r=rt(w),D=w.duration||1,cues=parseCues(w);
      el.querySelector('.tl-ph').style.left=r.t/D*100+'%';el.querySelector('.tl-tc').textContent=tc(r.t);
      const b=el.querySelector('.tl-cue b'),nm=cues[r.cue]?`${r.cue+1} · ${cues[r.cue].name}`:'—';if(b.textContent!==nm)b.textContent=nm;
      const pb=el.querySelector('[data-act="play"]');if(pb._p!==r.playing){pb._p=r.playing;pb.innerHTML=r.playing?ICON.pause:ICON.play;pb.classList.toggle('on',r.playing)}
      el.querySelector('[data-act="loop"]').classList.toggle('on',r.loop);
      el.querySelectorAll('.tl-blk').forEach(x=>x.classList.toggle('cur',+x.dataset.k===r.cue))}
    else if(w.type==='clock'){const m=el.querySelector('.clk-main'),sb=el.querySelector('.clk-sub'),d=new Date();let a,b,cl='';
      if(w.mode==='show'){a=tc(showT);b=`TC 25 fps · ${showPlaying?'PLAY':'STOP'}`;cl=showPlaying?'live':''}
      else if(w.mode==='countdown'){const [hh,mm]=(w.target||'23:30').split(':').map(Number),e=new Date(d);e.setHours(hh||0,mm||0,0,0);
        let s=Math.round((e-d)/1000);const neg=s<0;s=Math.abs(s);a=(neg?'+':'')+[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(v=>String(v).padStart(2,'0')).join(':');
        b=neg?`Oltre l'orario di fine (${w.target})`:`Fine alle ${w.target||'23:30'}`;cl=neg?'over':s<300?'warn':''}
      else{a=d.toLocaleTimeString('it-IT',{hour12:false});b=d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}
      if(m.textContent!==a)m.textContent=a;if(sb.textContent!==b)sb.textContent=b;
      el.classList.toggle('warn',cl==='warn');el.classList.toggle('over',cl==='over');el.classList.toggle('live',cl==='live')}
    else if(w.type==='scenes'&&w.addr==='/dmx/scene'){const k=SH.fade>0?clamp((n-SH.t0)/(SH.fade*1000)):1;
      el.querySelectorAll('.si').forEach((x,i)=>{const p=x.querySelector('.prog');p.style.width=(i===SH.scene&&k<1)?k*100+'%':'0'})}
  }
  requestAnimationFrame(loop);
}

      </div>

      <p class="note">Stesso broker di <code>patchdeck.html</code> e <code>dmx.html</code>: i device TD si trovano da soli da <code>gaia/device/+/status</code> e dalle matrici retained. Se il broker non risponde per 10 s si prova il fallback. Gli indirizzi OSC che iniziano con <code>/gaia/</code> il bridge di Plancia li manda all'ingresso OSC di Gaia. Senza broker raggiungibile i widget Gaia mostrano una simulazione.</p>
    </section>
    <section><h3 style="font-size:14px">Connessione OSC</h3>
      <label>Indirizzo del bridge<input id="sUrl" class="mono" spellcheck="false" autocapitalize="off"></label>

      <div class="row"><button class="btn primary" id="sApply">Connetti</button></div>

    </section>
    <section><h3 style="font-size:14px">Layout</h3>

      <div class="row"><button class="btn" id="sCopy">Copia</button><button class="btn" id="sLoad">Applica JSON</button></div>

    </section></div>`;
  let editP=GC.profile;
  const F=[['gBroker','broker'],['gWs','wsPort',1],['gFb','fallback'],['gNr','nodered'],['gNrP','noderedPort',1],['gAd','admin'],['gAdP','adminPort',1],['gOs','osc'],['gOsP','oscPort',1]];
  const fillProf=()=>{$('#gProf').innerHTML=Object.entries(GC.profiles).map(([k,v])=>`<option value="${esc(k)}"${k===editP?' selected':''}>${esc(v.name||k)}</option>`).join('');
    const n=GC.profiles[editP];$('#gPName').value=n.name||'';F.forEach(([id,k])=>$('#'+id).value=n[k]??'');$('#gDelP').disabled=editP in NET_DEFAULT};
  const readProf=()=>{const n=GC.profiles[editP];n.name=$('#gPName').value.trim()||n.name;F.forEach(([id,k,num])=>{const v=$('#'+id).value.trim();n[k]=num?(+v||n[k]):v})};
  $('#gOn').checked=GC.on;$('#gSt').value=GC.stanza;fillProf();
  $('#gProf').onchange=e=>{readProf();editP=e.target.value;fillProf()};
  $('#gDup').onclick=()=>{readProf();const k='p'+uid();GC.profiles[k]={...GC.profiles[editP],name:(GC.profiles[editP].name||'Profilo')+' (copia)'};editP=k;fillProf()};

    delete GC.profiles[editP];if(GC.profile===editP)GC.profile='casa';editP=GC.profile;delArmed=false;e.target.textContent='Elimina';store.set(GKEY,GC);fillProf()};

  $('#gApply').onclick=()=>{readProf();GC.on=$('#gOn').checked;GC.stanza=$('#gSt').value.trim()||'studio';GC.profile=editP;store.set(GKEY,GC);
    if(ws&&ws.readyState===1)ws.send(JSON.stringify(bridgeCfg()));
    G.offSince=null;nrConnect();if(GC.on){gSimOff();gLoadLib(()=>gConnect(net().broker));setTimeout(()=>{if(!G.ok)gSim()},4500)}else{try{G.client&&G.client.end(true)}catch{}G.client=null;G.ok=false;gSim()}gStatus();closeSheet()};
  $('#sUrl').value=C.url;$('#sHost').value=C.host;$('#sPort').value=C.port;

    armed=false;b.textContent='Sostituisci';b.classList.remove('danger')}});
  $('#sApply').onclick=()=>{C={...C,url:$('#sUrl').value.trim(),host:$('#sHost').value.trim()||'127.0.0.1',port:+$('#sPort').value||7000};store.set(CKEY,C);connect();closeSheet()};
  const msg=t=>$('#sMsg').textContent=t;

    if(navigator.clipboard)navigator.clipboard.writeText(ta.value).then(()=>msg('Layout copiato negli appunti.'),fb);else fb()};
  $('#sLoad').onclick=()=>{try{const j=JSON.parse($('#sJson').value);if(!Array.isArray(j.pages)||!j.pages.length)throw 0;L=j;if(!L.rig)L.rig={...RIG};pi=0;selId=null;save();render();initShow();msg('Layout applicato.')}catch{msg('JSON non valido: serve un oggetto con un elenco "pages".')}};
}

/* stato iniziale del rig dai controlli salvati, senza inviare OSC */
function initShow(){
  let sc=0;
  for(const w of allW()){if(!w.addr)continue;
    if(w.addr==='/dmx/scene'&&typeof w.value==='number'&&w.value>=0)sc=w.value;
    else if((w.addr.startsWith('/dmx/')||w.addr==='/led/bright')&&['fader','knob','button','scenes'].includes(w.type))model(w.addr,argsOf(w));
    else if(w.addr==='/mh/select')model(w.addr,argsOf(w));}
  goScene(sc,0);
}

render(); initShow(); connect(); gStart(); requestAnimationFrame(loop);
})();
