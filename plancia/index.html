<meta charset="utf-8">
<title>Plancia OSC</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/plancia.css">

<header class="bar">
  <div class="brand"><span class="mark"></span><span class="txt">PLANCIA</span></div>
  <nav id="tabs" class="tabs" aria-label="Pagine"></nav>
  <div class="spacer"></div>
  <button id="gconn" class="pill" title="Gaia"><i></i><span id="gconnTxt">Gaia</span></button>
  <button id="conn" class="pill" title="Connessione OSC"><i></i><span id="connTxt">Non connesso</span></button>
  <button id="saveStatus" class="pill" title="Salvataggio automatico del layout corrente sul server OPS"><i></i><span id="saveStatusTxt">Layout in attesa</span></button>
  <button id="editBtn" class="btn" title="Modifica la griglia dei widget. Le fixture del palco si aggiungono e si spostano direttamente nella Pianta.">Modifica griglia</button>
  <button id="menuBtn" class="btn ghost" aria-label="Impostazioni e template">⋯</button>
</header>
<div id="addbar" class="addbar" hidden>
  <span class="cap">Griglia widget</span><span class="help">Trascina per spostare · angolo per ridimensionare · modifiche salvate in automatico</span><span class="cap">Aggiungi</span>
  <button data-add="gaia">Gaia</button><button data-add="patchdeck">PatchDeck</button><button data-add="tddevice">Device TD</button><button data-add="gaiadmx">DMX stanza</button>
  <button data-add="fader">Fader</button><button data-add="knob">Manopola</button><button data-add="button">Pulsante</button>
  <button data-add="xy">Pad XY</button><button data-add="scenes">Scene</button><button data-add="color">Colore</button>
  <button data-add="timeline">Timeline</button><button data-add="clock">Orologio</button><button data-add="stage">Palco</button>
  <button data-add="meter">Indicatore</button><button data-add="label">Testo</button>
</div>
<div class="main">
  <div id="stage" class="stage"></div>
  <aside id="insp" class="insp" hidden></aside>
</div>
<footer class="mon">
  <div class="mcell" id="cOut"><b>OUT</b><span id="mOut">—</span></div>
  <div class="mcell" id="cIn"><b>IN</b><span id="mIn">—</span></div>
  <div class="rate" id="rate">0 msg/s</div>
</footer>
<div id="scrim" class="scrim" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<!-- bridge.js injects the shared state into this bootstrap script -->
<script></script>
<script src="/app.js" defer></script>
