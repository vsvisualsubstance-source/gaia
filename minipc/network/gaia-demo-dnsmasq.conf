# Riservation DHCP per la rete di trasferta (demo portatile).
# Installato in /etc/NetworkManager/dnsmasq-shared.d/gaia-demo.conf.
# Vale SOLO per la connessione NetworkManager "Gaia-Demo" (ipv4.method
# shared su enp0s31f6) — non tocca il DHCP/DNS normale di casa.
# Stesso meccanismo di pi/provision/gaia-captive-dnsmasq.conf, scopo diverso:
# qui non è un captive portal, sono riservation IP fisse per far coincidere
# la rete di trasferta con quella di casa (192.168.1.0/24), così ogni IP
# hardcoded nel repo (broker MQTT, gaia_admin, bridge Hue in OpenHAB) resta
# valido senza toccare codice. Vedi docs/demo-portatile.md.

# OPS (silvermini2)
dhcp-host=38:05:25:36:fa:af,192.168.1.240

# Pi (ingresso) — via cavo, aggiunto al suo WiFi esistente, non lo sostituisce.
# Due MAC sulla stessa riga = stesso IP indipendentemente da quale interfaccia
# usa: eth0 e wlan0 hanno MAC diversi sul Pi (verificato dal vivo 2026-08-10,
# differiscono di un bit: ...d8 eth0 vs ...d9 wlan0 — non dare per scontato
# che coincidano su altri Pi).
dhcp-host=dc:a6:32:fd:75:d8,dc:a6:32:fd:75:d9,192.168.1.190

# Bridge Hue — IP già salvato nel pairing OpenHAB (Thing.json), token riusato
dhcp-host=00:17:88:75:c9:3d,192.168.1.80

# TCC M (Sennheiser TeamConnect Ceiling) — portato in trasferta 2026-09-15,
# stesso IP di casa cosi' /etc/gaia/tccm.conf (default 192.168.1.235) non
# va mai toccato. MAC verificato dal vivo dal lease DHCP mentre cercavamo
# il device sulla rete demo (hostname annunciato "TCCM-001B6643417F").
dhcp-host=00:1b:66:43:41:7f,192.168.1.235
