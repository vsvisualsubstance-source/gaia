<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAIA DMX</title>
<style>
:root {
  --bg:#08090f; --card:#0e1221; --border:#1e2840;
  --accent:#00ffcc; --blue:#58a6ff; --green:#3fb950; --red:#f85149;
  --yellow:#e3b341; --cyan:#39c5cf;
  --text:#c9d1d9; --muted:#6b7a99;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;padding:24px;max-width:960px;margin:0 auto}
h1{color:var(--accent);font-size:1.6rem;margin-bottom:4px}
.subtitle{color:var(--muted);font-size:.9rem;margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:8px}
button{
  background:var(--accent);color:#000;border:none;border-radius:6px;
  padding:8px 16px;cursor:pointer;font-size:.85rem;font-weight:600;
  transition:opacity .15s;
}
button:hover{opacity:.85}
button:disabled{opacity:.3;cursor:default}
button.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
button.gray{background:var(--border);color:var(--text)}
button.red{background:var(--red);color:#fff}
button.green{background:var(--green);color:#02150a}
button.small{padding:4px 10px;font-size:.78rem}

.topnav{display:flex;align-items:center;gap:10px;padding-bottom:10px;margin-bottom:20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.topnav-title{font-size:1.1rem;font-weight:700;color:var(--accent);margin-right:4px}
.topnav-link{color:var(--muted);text-decoration:none;font-size:.8rem;padding:3px 9px;border-radius:6px;border:1px solid transparent}
.topnav-link:hover{color:var(--text);border-color:var(--border)}
.mqtt-dot{width:8px;height:8px;border-radius:50%;background:#444;display:inline-block;transition:background .3s;flex-shrink:0;margin-left:auto}
.mqtt-dot.ok{background:var(--green);box-shadow:0 0 5px var(--green)}
.mqtt-dot.err{background:var(--red)}

.dev-status{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dev-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:.8rem;font-weight:600}
.dev-badge.online{background:#0f2418;color:var(--green)}
.dev-badge.offline{background:#2a0f0f;color:var(--red)}
.dev-meta{color:var(--muted);font-size:.8rem}
.dev-warn{color:var(--yellow);font-size:.78rem;margin-top:10px}

.svc-row{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.svc-row .svc-label{font-size:.82rem;color:var(--text);min-width:150px}
.svc-state{font-size:.75rem;color:var(--muted);padding:2px 8px;border-radius:10px;background:var(--bg)}
.svc-state.active{color:var(--accent)}

.sect-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.sect{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px}
.sect-title{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--cyan);margin-bottom:10px}
.param-row{margin-bottom:12px}
.param-row:last-child{margin-bottom:0}
.param-row .p-label-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.param-row label{font-size:.78rem;color:var(--muted)}
.param-row .p-val{font-size:.78rem;color:var(--text);font-variant-numeric:tabular-nums}
.param-row .p-val.default{color:var(--muted);font-style:italic}
.param-row input[type=range]{width:100%;accent-color:var(--accent)}
.param-row select, .param-row input[type=number]{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:6px;
  color:var(--text);padding:5px 8px;font-size:.85rem;
}
.param-row input[type=color]{width:100%;height:30px;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:2px;cursor:pointer}
.param-row.dirty label{color:var(--yellow)}
.param-row.sent label{color:var(--accent)}
</style>
</head>
<body>

<div class="topnav">
  <div class="topnav-title">GAIA DMX</div>
  <a href="portal.html" class="topnav-link">⌂ Portal</a>
  <a href="admin.html" class="topnav-link">Admin</a>
  <a href="patchdeck.html" class="topnav-link">🎛 PatchDeck</a>
  <a href="mixeraudio.html" class="topnav-link">🎚 MixerAudio</a>
  <span id="mqtt-dot" class="mqtt-dot"></span>
</div>

<h1>💡 DMX</h1>
<div class="subtitle">Chase audio-reattivo DMX (DMX V7 / TouchDesigner) — dimmer, colore, kick, fixture</div>

<div class="card">
  <h2>Stato device</h2>
  <div class="dev-status">
    <span id="dev-badge" class="dev-badge offline">● offline</span>
    <span class="dev-meta" id="dev-meta">nessun dato ricevuto</span>
  </div>
  <div id="dev-warn" class="dev-warn" style="display:none"></div>
  <div class="svc-row">
    <span class="svc-label">Kick enable</span>
    <span id="svc-dmx_kick_enable-state" class="svc-state">—</span>
    <button class="small green" data-svc="dmx_kick_enable" data-action="enable">▶ On</button>
    <button class="small red" data-svc="dmx_kick_enable" data-action="disable">■ Off</button>
  </div>
  <div class="svc-row">
    <span class="svc-label">Sorgente file (test)</span>
    <span id="svc-dmx_use_file_input-state" class="svc-state">—</span>
    <button class="small green" data-svc="dmx_use_file_input" data-action="enable">📁 Usa file</button>
    <button class="small red" data-svc="dmx_use_file_input" data-action="disable">🎙 Usa live</button>
  </div>
  <div class="svc-row">
    <span class="svc-label">Fixture profile</span>
    <span id="svc-dmx_apply_fixture_profile-state" class="svc-state">azione</span>
    <button class="small secondary" data-svc="dmx_apply_fixture_profile" data-action="enable">⚡ Applica</button>
  </div>
</div>

<div class="card">
  <h2>Parametri</h2>
  <div id="param-sections"></div>
</div>

<script>
// Stesso pattern MQTT-over-WS di admin.html/patchdeck.html/mixeraudio.html.
const DX_BROKER = '192.168.1.142';
const DX_DEVICE_ID = 'td-dmx.1';
const DX_STALE_MS = 90000;

// Raggruppamento SOLO visivo (etichette/ordine) -- il set reale di
// parametri/tipi/range/opzioni viene sempre da dmx_matrix (introspezione
// TD vera, par.min/par.max/par.menuNames), mai hardcodato qui. Un gruppo
// "Altro" raccoglie qualunque param nella matrice non elencato sotto.
const DX_SECTIONS = [
  { title: 'Dimmer', params: ['dmx_min_dimmer', 'dmx_max_dimmer', 'dmx_dimmer_boost', 'dmx_dimmer_gamma'] },
  { title: 'Colore / Smoothing', params: ['dmx_color_curve', 'dmx_color_fade', 'dmx_color_speed', 'dmx_color_phase', 'dmx_bar_phase', 'dmx_smooth_factor', 'dmx_global_smooth'] },
  { title: 'Audio / Kick', params: ['dmx_agc_release', 'dmx_min_range', 'dmx_kick_threshold', 'dmx_kick_boost', 'dmx_kick_decay', 'dmx_kick_cooldown', 'dmx_kick_smooth'] },
  { title: 'Fixture patch', params: ['dmx_fixture_count', 'dmx_start_address', 'dmx_palette', 'dmx_fixture_profile'] },
  { title: 'Colori custom', params: ['dmx_custom_color1', 'dmx_custom_color2', 'dmx_custom_color3', 'dmx_custom_color4', 'dmx_custom_color5'] },
];

let dxClient = null;
let dxDevice = null;   // ultimo status (services/params live -- puo' essere vuoto se il device non ha ancora ri-registrato tutto)
let dxMatrix = null;   // gaia/devices/{id}/dmx_matrix (retained) -- schema autoritativo: type/range/options/default per param
let dxBuilt = false;

function dxSetConn(ok) {
  document.getElementById('mqtt-dot').className = 'mqtt-dot ' + (ok ? 'ok' : 'err');
}

function dxSendAction(service, action) {
  if (!dxClient || !dxClient.connected) return;
  dxClient.publish(`gaia/device/${DX_DEVICE_ID}/command`, JSON.stringify({ action, service }));
}

function dxSendParam(param, value) {
  if (!dxClient || !dxClient.connected) return;
  dxClient.publish(`gaia/device/${DX_DEVICE_ID}/command`, JSON.stringify({ action: 'set', param, value }));
}

// Stesso trucco di mixeraudio.html: _apply_command() lato TD rifà sempre
// _publish_status() a fine funzione qualunque sia l'azione -- usato per
// forzare un refresh ogni secondo senza modifiche lato TD.
let dxPollTimer = null;
function dxStartPolling() {
  if (dxPollTimer) return;
  dxPollTimer = setInterval(() => {
    if (document.hidden || !dxClient?.connected) return;
    dxClient.publish(`gaia/device/${DX_DEVICE_ID}/command`, JSON.stringify({ action: 'status', service: '_poll' }));
  }, 1000);
}
// I browser rallentano/bloccano i timer delle schede in background --
// se il valore cambia in TD mentre questa pagina non è la scheda attiva,
// il poll da 1s può non ripartire subito al ritorno in primo piano.
// Forza un refresh immediato appena la scheda torna visibile (stesso
// fix già in mixeraudio.html, mancava qui).
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && dxClient?.connected) {
    dxClient.publish(`gaia/device/${DX_DEVICE_ID}/command`, JSON.stringify({ action: 'status', service: '_poll' }));
  }
});

function dxRgbToHex(arr) {
  const c = (v) => Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, '0');
  return '#' + c(arr[0]) + c(arr[1]) + c(arr[2]);
}
function dxHexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
}

function dxCurrentValue(name, def) {
  const live = dxDevice?.params || {};
  return (name in live) ? { value: live[name], isDefault: false } : { value: def.default, isDefault: def.default !== undefined };
}

function dxBuildParamRow(name, def) {
  const { value, isDefault } = dxCurrentValue(name, def);
  const label = name.replace(/^dmx_/, '').replace(/_/g, ' ');
  const valBadge = `<span class="p-val${isDefault ? ' default' : ''}" data-valdisp="${name}">${isDefault ? '(predefinito)' : ''}</span>`;

  if (def.type === 'enum') {
    const opts = (def.options || []).map(o => `<option value="${o}" ${o === value ? 'selected' : ''}>${o}</option>`).join('');
    return `<div class="param-row" data-row="${name}">
      <div class="p-label-row"><label>${label}</label>${valBadge}</div>
      <select data-param="${name}" data-kind="enum">${opts}</select>
    </div>`;
  }
  if (def.type === 'color_rgb') {
    const hex = Array.isArray(value) ? dxRgbToHex(value) : '#000000';
    return `<div class="param-row" data-row="${name}">
      <div class="p-label-row"><label>${label}</label>${valBadge}</div>
      <input type="color" value="${hex}" data-param="${name}" data-kind="color_rgb">
    </div>`;
  }
  // float/int con range noto -> slider + numero
  const [min, max] = def.range || [0, 1];
  const step = def.type === 'int' ? 1 : (max - min) / 500 || 0.01;
  return `<div class="param-row" data-row="${name}">
    <div class="p-label-row"><label>${label}</label>${valBadge}</div>
    <input type="range" min="${min}" max="${max}" step="${step}" value="${value ?? min}" data-param="${name}" data-kind="range">
  </div>`;
}

function dxBuildSections() {
  const wrap = document.getElementById('param-sections');
  if (!dxMatrix) { wrap.innerHTML = '<div class="dev-meta">In attesa della matrice (gaia/devices/…/dmx_matrix)…</div>'; return; }
  const known = new Set(DX_SECTIONS.flatMap(s => s.params));
  const extra = Object.keys(dxMatrix.params || {}).filter(k => !known.has(k)).sort();
  const sections = extra.length ? [...DX_SECTIONS, { title: 'Altro', params: extra }] : DX_SECTIONS;

  wrap.innerHTML = `<div class="sect-grid">${sections.map(sect => {
    const rows = sect.params.filter(p => dxMatrix.params[p]).map(p => dxBuildParamRow(p, dxMatrix.params[p])).join('');
    return rows ? `<div class="sect"><div class="sect-title">${sect.title}</div>${rows}</div>` : '';
  }).join('')}</div>`;

  wrap.querySelectorAll('[data-param]').forEach(el => {
    const name = el.dataset.param;
    const kind = el.dataset.kind;
    const row = () => el.closest('.param-row');
    if (kind === 'range') {
      el.addEventListener('input', () => {
        row().classList.add('dirty');
        const disp = wrap.querySelector(`[data-valdisp="${name}"]`);
        if (disp) { disp.textContent = Number(el.value).toFixed(3); disp.classList.remove('default'); }
      });
      el.addEventListener('change', () => {   // 'change' su un range = al rilascio, non ad ogni tick di drag
        row().classList.remove('dirty');
        row().classList.add('sent');
        setTimeout(() => row().classList.remove('sent'), 400);
        dxSendParam(name, parseFloat(el.value));
      });
    } else if (kind === 'enum') {
      el.addEventListener('change', () => {
        row().classList.add('sent');
        setTimeout(() => row().classList.remove('sent'), 400);
        dxSendParam(name, el.value);
      });
    } else if (kind === 'color_rgb') {
      el.addEventListener('change', () => {
        row().classList.add('sent');
        setTimeout(() => row().classList.remove('sent'), 400);
        dxSendParam(name, dxHexToRgb(el.value));
      });
    }
  });
  dxBuilt = true;
}

function dxUpdateValues() {
  if (!dxBuilt || !dxMatrix) return;
  for (const [name, def] of Object.entries(dxMatrix.params || {})) {
    const el = document.querySelector(`[data-param="${name}"]`);
    if (!el || el === document.activeElement) continue;
    const row = el.closest('.param-row');
    if (row.classList.contains('dirty')) continue;
    const { value, isDefault } = dxCurrentValue(name, def);
    const disp = document.querySelector(`[data-valdisp="${name}"]`);
    if (def.type === 'color_rgb') {
      if (Array.isArray(value)) el.value = dxRgbToHex(value);
    } else if (def.type === 'enum') {
      if (value !== undefined) el.value = value;
    } else {
      if (value !== undefined && el.value !== String(value)) el.value = value;
      if (disp) disp.textContent = value !== undefined ? Number(value).toFixed(3) : '';
    }
    if (disp) disp.classList.toggle('default', isDefault);
  }
}

function dxRenderSvc(svc) {
  const el = document.getElementById(`svc-${svc}-state`);
  if (!el) return;
  const state = (dxDevice?.services || {})[svc];
  if (svc === 'dmx_apply_fixture_profile') { el.textContent = 'azione'; return; }
  el.textContent = state || 'inactive';
  el.classList.toggle('active', state === 'active');
}

function dxRenderAll() {
  const badge = document.getElementById('dev-badge');
  const meta = document.getElementById('dev-meta');
  const warn = document.getElementById('dev-warn');
  if (!dxDevice) return;
  const offline = dxDevice._offline;
  badge.className = 'dev-badge ' + (offline ? 'offline' : 'online');
  badge.textContent = offline ? '● offline' : '● online';
  meta.textContent = `${dxDevice.name || DX_DEVICE_ID} · ip ${dxDevice.ip || '?'} · ${dxDevice.stanza || '?'}`;
  const empty = !Object.keys(dxDevice.services || {}).length && !Object.keys(dxDevice.params || {}).length;
  if (empty) {
    warn.style.display = '';
    warn.textContent = '⚠ il device non riporta ancora servizi/parametri live (registro vuoto) — i controlli sotto mostrano i valori predefiniti dalla matrice, non lo stato reale finché il device non li pubblica.';
  } else {
    warn.style.display = 'none';
  }
  dxRenderSvc('dmx_kick_enable');
  dxRenderSvc('dmx_use_file_input');
  dxRenderSvc('dmx_apply_fixture_profile');
  if (!dxBuilt) dxBuildSections();
  else dxUpdateValues();
}

function dxInit() {
  const mqttUrl = `ws://${DX_BROKER}:9001`;
  function start() {
    dxClient = mqtt.connect(mqttUrl);
    dxClient.on('connect', () => {
      dxSetConn(true);
      dxClient.subscribe(`gaia/device/${DX_DEVICE_ID}/status`);
      dxClient.subscribe(`gaia/devices/${DX_DEVICE_ID}/dmx_matrix`);
      dxStartPolling();
    });
    dxClient.on('error',   () => dxSetConn(false));
    dxClient.on('offline', () => dxSetConn(false));
    dxClient.on('message', (topic, raw) => {
      if (!raw || !raw.length) return;
      if (topic.endsWith('/dmx_matrix')) {
        try {
          const m = JSON.parse(raw.toString());
          if (m.device_id !== DX_DEVICE_ID) return;
          dxMatrix = m;
          if (!dxBuilt) dxBuildSections();
        } catch (e) {}
        return;
      }
      try {
        const d = JSON.parse(raw.toString());
        if (d.device_id !== DX_DEVICE_ID) return;
        d._offline = false;
        d._lastSeen = Date.now();
        dxDevice = d;
        dxRenderAll();
      } catch (e) {}
    });
    setInterval(() => {
      if (dxDevice && Date.now() - dxDevice._lastSeen > DX_STALE_MS && !dxDevice._offline) {
        dxDevice._offline = true;
        dxRenderAll();
      }
    }, 10000);
  }
  if (typeof mqtt !== 'undefined') {
    start();
  } else {
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/mqtt/dist/mqtt.min.js';
    s.onload = start;
    document.head.appendChild(s);
  }
}

document.querySelectorAll('[data-svc][data-action]').forEach(btn => {
  btn.onclick = () => dxSendAction(btn.dataset.svc, btn.dataset.action);
});

dxInit();
</script>
</body>
</html>
