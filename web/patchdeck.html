<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAIA PatchDeck</title>
<style>
:root {
  --bg:#08090f; --card:#0e1221; --border:#1e2840;
  --accent:#00ffcc; --blue:#58a6ff; --green:#3fb950; --red:#f85149;
  --yellow:#e3b341; --cyan:#39c5cf;
  --text:#c9d1d9; --muted:#6b7a99;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;padding:24px;max-width:960px;margin:0 auto}
h1{color:var(--accent);font-size:1.6rem;margin-bottom:4px}
.subtitle{color:var(--muted);font-size:.9rem;margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:8px}
button{
  background:var(--accent);color:#000;border:none;border-radius:6px;
  padding:8px 16px;cursor:pointer;font-size:.85rem;font-weight:600;
  transition:opacity .15s, transform .1s;
}
button:hover{opacity:.85}
button:disabled{opacity:.3;cursor:default}
button.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
button.gray{background:var(--border);color:var(--text)}
button.red{background:var(--red);color:#fff}
button.green{background:var(--green);color:#02150a}
button.small{padding:4px 10px;font-size:.78rem}

.topnav{display:flex;align-items:center;gap:10px;padding-bottom:10px;margin-bottom:20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.topnav-title{font-size:1.1rem;font-weight:700;color:var(--accent);margin-right:4px}
.topnav-link{color:var(--muted);text-decoration:none;font-size:.8rem;padding:3px 9px;border-radius:6px;border:1px solid transparent}
.topnav-link:hover{color:var(--text);border-color:var(--border)}
.mqtt-dot{width:8px;height:8px;border-radius:50%;background:#444;display:inline-block;transition:background .3s;flex-shrink:0;margin-left:auto}
.mqtt-dot.ok{background:var(--green);box-shadow:0 0 5px var(--green)}
.mqtt-dot.err{background:var(--red)}

.dev-status{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dev-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:.8rem;font-weight:600}
.dev-badge.online{background:#0f2418;color:var(--green)}
.dev-badge.offline{background:#2a0f0f;color:var(--red)}
.dev-meta{color:var(--muted);font-size:.8rem}

.deck-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.deck-hdr .deck-title{font-size:1rem;font-weight:700;color:var(--text);margin-right:auto}
.deck-hdr .deck-state{font-size:.75rem;color:var(--muted);padding:2px 8px;border-radius:10px;background:var(--bg)}
.deck-hdr .deck-state.active{color:var(--accent)}

.patch-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-bottom:12px}
.fx-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.fx-row .fx-label{min-width:110px;font-size:.85rem;color:var(--text);text-transform:capitalize}
.fx-row input[type=range]{flex:1}
.fx-row .fx-val{min-width:44px;text-align:right;font-size:.8rem;color:var(--muted)}
.patch-cell{
  aspect-ratio:1.1;background:var(--bg);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-size:.82rem;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;
  transition:all .12s;
}
.patch-cell:hover{border-color:var(--accent);color:var(--accent)}
.patch-cell:disabled{opacity:.15;cursor:default;border-style:dashed}
.patch-cell.active{background:#001a12;border-color:var(--accent);color:var(--accent)}
.patch-cell.flash{background:var(--accent);color:#000;border-color:var(--accent)}

.pager{display:flex;align-items:center;gap:10px;justify-content:center}
.pager span{color:var(--muted);font-size:.8rem;min-width:100px;text-align:center}
</style>
</head>
<body>

<div class="topnav">
  <div class="topnav-title">GAIA PatchDeck</div>
  <a href="portal.html" class="topnav-link">⌂ Portal</a>
  <a href="admin.html" class="topnav-link">Admin</a>
  <a href="mixeraudio.html" class="topnav-link">🎚 MixerAudio</a>
  <a href="dmx.html" class="topnav-link">💡 DMX</a>
  <a href="dashboard.html" class="topnav-link">Dashboard</a>
  <span id="mqtt-dot" class="mqtt-dot"></span>
</div>

<h1>🎛 PatchDeck</h1>
<div class="subtitle">Controllo remoto dei deck A/B di PatchDeck (APC40 · TouchDesigner) via MQTT</div>

<div class="card">
  <h2>Stato device</h2>
  <div class="dev-status">
    <span id="dev-badge" class="dev-badge offline">● offline</span>
    <span class="dev-meta" id="dev-meta">nessun dato ricevuto</span>
  </div>
</div>

<div class="card">
  <div class="deck-hdr">
    <span class="deck-title">Deck A</span>
    <span id="deckA-state" class="deck-state">—</span>
    <button class="small green" data-deck="a" data-action="enable">▶ Start</button>
    <button class="small red" data-deck="a" data-action="disable">■ Stop</button>
    <button class="small gray" data-deck="a" data-action="restart">↺ Restart</button>
  </div>
  <div id="deckA-grid" class="patch-grid"></div>
  <div class="pager">
    <button class="small secondary" id="deckA-prev">‹ Prec</button>
    <span id="deckA-page">Pagina 1/2 (1–24)</span>
    <button class="small secondary" id="deckA-next">Succ ›</button>
  </div>
</div>

<div class="card">
  <div class="deck-hdr">
    <span class="deck-title">Deck B</span>
    <span id="deckB-state" class="deck-state">—</span>
    <button class="small green" data-deck="b" data-action="enable">▶ Start</button>
    <button class="small red" data-deck="b" data-action="disable">■ Stop</button>
    <button class="small gray" data-deck="b" data-action="restart">↺ Restart</button>
  </div>
  <div id="deckB-grid" class="patch-grid"></div>
  <div class="pager">
    <button class="small secondary" id="deckB-prev">‹ Prec</button>
    <span id="deckB-page">Pagina 1/2 (1–24)</span>
    <button class="small secondary" id="deckB-next">Succ ›</button>
  </div>
</div>

<!-- FX (2026-08-31): nascosta di default -- si mostra da sola solo quando
     pdMatrix.params contiene voci kind:'fx_param' (proposta per TD/Mac in
     GAIA_INTERFACE.md, non ancora implementata lato TD al momento di
     scrivere questo). Nessun nome hardcoded, tutto costruito dalla
     matrice reale -- vedi pdRenderFx(). -->
<div class="card" id="fx-card" style="display:none">
  <div class="deck-hdr"><span class="deck-title">FX</span></div>
  <div id="fx-controls"></div>
</div>

<script>
// Stesso pattern MQTT-over-WS di admin.html (pmSend/gaia/device/+/status) --
// mosquitto resta su Core anche se Node-RED gira altrove, non segue
// location.hostname (vedi commento in admin.html initPiManager()).
const PD_BROKER = '192.168.1.142';
// Scoperto dal vivo, non piu' hardcoded (2026-08-28): il device_id di
// PatchDeck e' cambiato piu' volte nella stessa serata durante la
// migrazione al nuovo Agent universale (td-MacBook-Air-di-Mauro.local ->
// PatchDeck-Mac-Mauro) -- un ID fisso qui rompe la pagina ad ogni rename,
// i comandi finiscono su un device ormai muto senza nessun errore
// visibile. Stesso principio gia' in dmx.html: il segnale di
// appartenenza autoritativo e' chi pubblica davvero, non un nome scritto
// qui. Ricorda l'ultimo device confermato vivo (localStorage) per
// restare stabile tra un reload e l'altro finche' risponde davvero.
let PD_DEVICE_ID = localStorage.getItem('gaiaPatchdeckDeviceId') || null;
let pdConfirmed = false;   // true quando arriva un vero status per PD_DEVICE_ID
// Candidati visti nel frattempo mentre si aspetta conferma del device
// ricordato (2026-08-28): senza questo, i messaggi di un device NUOVO che
// arrivano PRIMA della scadenza della finestra di grazia venivano scartati
// (non combaciano ancora con PD_DEVICE_ID) e la pagina restava ad
// aspettare il prossimo aggiornamento live del device nuovo, che puo'
// tardare parecchio se l'heartbeat non e' frequente -- stesso principio
// del bug gia' trovato e fissato in dmx.html.
const pdCandidates = {};   // device_id -> { matrix, status }
const PD_PATCH_COUNT = 38;   // load_x1..38, vedi GAIA_INTERFACE.md (TD4Gaia) 2026-08-24
const PD_PAGE_SIZE = 24;     // griglia 8x3 visibile per pagina

let pdClient = null;
let pdDevice = null;
let pdMatrix = null;   // gaia/devices/{id}/patchdeck_matrix (retained, canale 5) -- {decks,patches,services{kind,patch,deck}}
const pdPage = { a: 0, b: 0 };

// Elenco {patch, key} per deck, derivato dalla matrice meccanica se
// disponibile (kind:"load_patch") -- fallback alla convenzione di naming
// load_x{N}_{deck} solo se la matrice non e' ancora arrivata (es. primo
// istante prima che il retained message venga consegnato).
function pdPatchList(deck) {
  if (pdMatrix?.services) {
    return Object.entries(pdMatrix.services)
      .filter(([, s]) => s.kind === 'load_patch' && String(s.deck).toLowerCase() === deck)
      .map(([key, s]) => ({ patch: s.patch, key }))
      .sort((a, b) => a.patch - b.patch);
  }
  return Array.from({ length: PD_PATCH_COUNT }, (_, i) => ({ patch: i + 1, key: `load_x${i + 1}_${deck}` }));
}

function pdDeckToggleKey(deck) {
  if (pdMatrix?.services) {
    const hit = Object.entries(pdMatrix.services)
      .find(([, s]) => s.kind === 'deck_toggle' && String(s.deck).toLowerCase() === deck);
    if (hit) return hit[0];
  }
  return `deck_${deck}`;
}

function pdSetConn(ok) {
  const dot = document.getElementById('mqtt-dot');
  dot.className = 'mqtt-dot ' + (ok ? 'ok' : 'err');
}

function pdSend(service, action) {
  if (!pdClient || !pdClient.connected) return;
  pdClient.publish(`gaia/device/${PD_DEVICE_ID}/command`, JSON.stringify({ action, service }));
}

function pdSendParam(param, value) {
  if (!pdClient || !pdClient.connected) return;
  pdClient.publish(`gaia/device/${PD_DEVICE_ID}/command`, JSON.stringify({ action: 'set', param, value }));
}

// FX (2026-08-31, proposta non ancora implementata lato TD -- vedi
// GAIA_INTERFACE.md): genera gli slider dalla matrice reale, nessun nome
// hardcoded -- resta a display:none finché non arriva almeno un
// kind:'fx_param'. Skip-se-focus per non interrompere il drag dell'utente
// mentre un valore live continua ad aggiornare (stesso principio già in
// produzione su mixeraudio.html/dmx.html).
function pdRenderFx() {
  const card = document.getElementById('fx-card');
  const wrap = document.getElementById('fx-controls');
  const params = Object.entries(pdMatrix?.params || {}).filter(([, p]) => p.kind === 'fx_param');
  if (!params.length) { card.style.display = 'none'; return; }
  card.style.display = '';
  const live = pdDevice?.params || {};
  for (const [name, meta] of params) {
    const inputId = `fx-inp-${name}`;
    let row = document.getElementById(`fx-row-${name}`);
    if (!row) {
      row = document.createElement('div');
      row.id = `fx-row-${name}`;
      row.className = 'fx-row';
      const label = meta.label || name.replace(/^fx_/, '').replace(/_/g, ' ');
      row.innerHTML = `<span class="fx-label"></span>
        <input type="range" id="${inputId}">
        <span class="fx-val" id="fx-val-${name}"></span>`;
      row.querySelector('.fx-label').textContent = label;
      const inp = row.querySelector('input');
      const [min, max] = Array.isArray(meta.range) ? meta.range : [0, 1];
      inp.min = min; inp.max = max; inp.step = (max - min) / 100 || 0.01;
      inp.oninput = () => { document.getElementById(`fx-val-${name}`).textContent = (+inp.value).toFixed(2); };
      inp.onchange = () => pdSendParam(name, +inp.value);
      wrap.appendChild(row);
    }
    const inp = document.getElementById(inputId);
    if (document.activeElement !== inp) {
      const val = typeof live[name] === 'number' ? live[name] : (meta.default ?? 0);
      inp.value = val;
      document.getElementById(`fx-val-${name}`).textContent = (+val).toFixed(2);
    }
  }
}

function pdFlash(el) {
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 350);
}

function pdRenderGrid(deck) {
  const grid = document.getElementById(`deck${deck.toUpperCase()}-grid`);
  const services = pdDevice?.services || {};
  const list = pdPatchList(deck);
  const start = pdPage[deck] * PD_PAGE_SIZE;
  grid.innerHTML = '';
  for (let i = 0; i < PD_PAGE_SIZE; i++) {
    const item = list[start + i];
    const btn = document.createElement('button');
    btn.className = 'patch-cell';
    if (!item) {
      btn.disabled = true;
      btn.textContent = '';
    } else {
      btn.textContent = item.patch;
      if (services[item.key] === 'active') btn.classList.add('active');
      btn.onclick = () => { pdFlash(btn); pdSend(item.key, 'enable'); };
    }
    grid.appendChild(btn);
  }
  const totalPages = Math.max(1, Math.ceil(list.length / PD_PAGE_SIZE));
  const lo = list[start]?.patch ?? '–';
  const hi = list[Math.min(start + PD_PAGE_SIZE, list.length) - 1]?.patch ?? '–';
  document.getElementById(`deck${deck.toUpperCase()}-page`).textContent =
    `Pagina ${pdPage[deck] + 1}/${totalPages} (${lo}–${hi})`;
  document.getElementById(`deck${deck.toUpperCase()}-prev`).disabled = pdPage[deck] === 0;
  document.getElementById(`deck${deck.toUpperCase()}-next`).disabled = pdPage[deck] >= totalPages - 1;
}

function pdRenderDeckState(deck) {
  const el = document.getElementById(`deck${deck.toUpperCase()}-state`);
  const state = (pdDevice?.services || {})[pdDeckToggleKey(deck)] || 'inactive';
  el.textContent = state;
  el.classList.toggle('active', state === 'active');
}

function pdRenderDevice() {
  const badge = document.getElementById('dev-badge');
  const meta = document.getElementById('dev-meta');
  if (!pdDevice) return;
  const offline = pdDevice._offline;
  badge.className = 'dev-badge ' + (offline ? 'offline' : 'online');
  badge.textContent = offline ? '● offline' : '● online';
  meta.textContent = `${pdDevice.name || PD_DEVICE_ID} · stanza ${pdDevice.stanza || '?'} · ip ${pdDevice.ip || '?'}`;
  pdRenderDeckState('a');
  pdRenderDeckState('b');
  pdRenderGrid('a');
  pdRenderGrid('b');
  pdRenderFx();
}

// Adotta un device_id come quello attivo, applicando subito qualunque
// dato gia' visto per lui in pdCandidates (evita di aspettare un altro
// giro di messaggi dopo averlo scelto).
function pdAdopt(id) {
  PD_DEVICE_ID = id;
  pdConfirmed = false;
  localStorage.setItem('gaiaPatchdeckDeviceId', id);
  const c = pdCandidates[id];
  if (c?.matrix) { pdMatrix = c.matrix; pdPage.a = 0; pdPage.b = 0; }
  if (c?.status) {
    const d = { ...c.status };
    d._lastSeen = d.ts || Date.now();
    d._offline = (Date.now() - d._lastSeen) > 90000;
    pdDevice = d;
    pdConfirmed = true;
  }
  pdRenderGrid('a');
  pdRenderGrid('b');
  pdRenderDevice();
}

function pdInit() {
  const mqttUrl = `ws://${PD_BROKER}:9001`;
  function start() {
    pdClient = mqtt.connect(mqttUrl);
    pdClient.on('connect', () => {
      pdSetConn(true);
      pdClient.subscribe('gaia/device/+/status');
      // Wildcard, non piu' un device_id fisso (2026-08-28) -- vedi nota su
      // PD_DEVICE_ID sopra. Retained, canale 5: la matrice arriva subito
      // alla subscribe anche se PatchDeck e' offline.
      pdClient.subscribe('gaia/devices/+/patchdeck_matrix');
      // Il device ricordato da un reload precedente potrebbe essere morto
      // per davvero (rinominato/sostituito, non solo momentaneamente
      // offline) -- se non conferma un vero status entro questa finestra,
      // ci si libera e si adotta subito il miglior candidato gia' visto nel
      // frattempo (pdCandidates), invece di aspettare passivamente il
      // prossimo aggiornamento live (che puo' tardare).
      setTimeout(() => {
        if (pdConfirmed) return;
        // Solo candidati con una matrice vera (patchdeck_matrix) sono device
        // PatchDeck reali -- un candidato con solo .status (ora possibile,
        // vedi nota sopra) potrebbe essere Core/OPS/qualunque altro device
        // sul wildcard, mai adottabile qui.
        const real = Object.entries(pdCandidates).filter(([, c]) => c.matrix);
        const withStatus = real.find(([, c]) => c.status);
        const any = withStatus || real[0];
        if (any) { pdAdopt(any[0]); } else { PD_DEVICE_ID = null; pdMatrix = null; pdDevice = null; pdRenderDevice(); }
      }, 1500);
    });
    pdClient.on('error',   () => pdSetConn(false));
    pdClient.on('offline', () => pdSetConn(false));
    pdClient.on('message', (topic, raw) => {
      if (!raw || !raw.length) return;
      if (topic.endsWith('/patchdeck_matrix')) {
        try {
          const m = JSON.parse(raw.toString());
          (pdCandidates[m.device_id] = pdCandidates[m.device_id] || {}).matrix = m;
          if (PD_DEVICE_ID === null) pdAdopt(m.device_id);
          if (m.device_id !== PD_DEVICE_ID) return;
          pdMatrix = m;
          pdPage.a = 0; pdPage.b = 0;
          // TERZO BUG REALE (stesso giorno, stavolta con localStorage
          // "avvelenato" da PRIMA di questo fix): un PD_DEVICE_ID ricordato
          // da un reload precedente (es. agganciato per sbaglio a Core dal
          // bug originale) veniva accettato ciecamente per ogni status
          // successivo -- Core pubblica status di continuo, quindi
          // "sembrava" sempre confermato. Se lo status era gia' arrivato ma
          // non ancora applicato (vedi il filtro sotto), applicalo ora che
          // la matrice conferma per davvero che e' un PatchDeck vero.
          if (!pdConfirmed && pdCandidates[m.device_id]?.status) {
            const d = { ...pdCandidates[m.device_id].status };
            d._lastSeen = d.ts || Date.now();
            d._offline = (Date.now() - d._lastSeen) > 90000;
            pdDevice = d;
            pdConfirmed = true;
          }
          pdRenderFx();
          if (pdDevice) pdRenderDevice(); else { pdRenderGrid('a'); pdRenderGrid('b'); }
        } catch (e) {}
        return;
      }
      try {
        const d = JSON.parse(raw.toString());
        // BUG REALE trovato dal vivo con un browser vero contro il broker
        // vero (2026-08-28, jsdom con soli messaggi PatchDeck non l'aveva
        // beccato): gaia/device/+/status e' il flusso di TUTTI i device di
        // Gaia (Core/OPS/Pi/DMX/...), non solo PatchDeck -- adottare da qui
        // ha fatto agganciare la pagina al miniPC Core stesso, il primo
        // status arrivato sul wildcard. L'adozione scatta SOLO dalla
        // matrice (patchdeck_matrix, che pubblicano solo device PatchDeck
        // veri) -- vedi il filtro su c.matrix qui sotto e nel timeout.
        // SECONDO BUG REALE (stesso giorno, trovato aspettando piu' a lungo
        // col browser vero): il retained di /status puo' arrivare PRIMA di
        // quello di patchdeck_matrix (le due subscribe non garantiscono
        // ordine di consegna) -- se qui si scartava lo status per un
        // candidato non ancora creato, andava perso per sempre (i retained
        // si consegnano una sola volta per subscribe), e la pagina restava
        // "nessun dato ricevuto" fino al prossimo heartbeat live (10-20s+).
        // Ora si crea/aggiorna sempre il candidato -- l'adozione resta
        // comunque vietata da qui, la decide solo chi ha un .matrix vero.
        //
        // TERZO BUG REALE, vedi nota gemella nell'handler della matrice
        // qui sopra: uno status NON va MAI applicato come vero finche' non
        // e' confermato da una matrice reale per lo stesso device_id --
        // altrimenti un PD_DEVICE_ID ricordato per sbaglio da un vecchio
        // localStorage (es. Core, che pubblica status di continuo) resta
        // agganciato per sempre perche' "sembra" sempre confermato.
        (pdCandidates[d.device_id] = pdCandidates[d.device_id] || {}).status = d;
        if (d.device_id !== PD_DEVICE_ID) return;
        if (!pdCandidates[d.device_id]?.matrix) return;
        pdConfirmed = true;
        // Usa il ts INCORPORATO nel messaggio, non l'orario di ricezione --
        // un retained vecchio arriva "ora" ma non e' fresco (bug gia' noto,
        // vedi TDDeviceRegistry lato Python).
        d._lastSeen = d.ts || Date.now();
        d._offline = (Date.now() - d._lastSeen) > 90000;
        pdDevice = d;
        pdRenderDevice();
      } catch (e) {}
    });
    setInterval(() => {
      if (pdDevice && Date.now() - pdDevice._lastSeen > 90000 && !pdDevice._offline) {
        pdDevice._offline = true;
        pdRenderDevice();
      }
    }, 10000);
  }
  if (typeof mqtt !== 'undefined') {
    start();
  } else {
    const s = document.createElement('script');
    s.src = 'vendor/mqtt.min.js';
    s.onload = start;
    document.head.appendChild(s);
  }
}

document.querySelectorAll('[data-deck][data-action]').forEach(btn => {
  btn.onclick = () => pdSend(pdDeckToggleKey(btn.dataset.deck), btn.dataset.action);
});
document.getElementById('deckA-prev').onclick = () => { if (pdPage.a > 0) { pdPage.a--; pdRenderGrid('a'); } };
document.getElementById('deckA-next').onclick = () => { pdPage.a++; pdRenderGrid('a'); };
document.getElementById('deckB-prev').onclick = () => { if (pdPage.b > 0) { pdPage.b--; pdRenderGrid('b'); } };
document.getElementById('deckB-next').onclick = () => { pdPage.b++; pdRenderGrid('b'); };

pdRenderGrid('a');
pdRenderGrid('b');
pdInit();
</script>
</body>
</html>
