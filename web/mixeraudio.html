<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAIA MixerAudio</title>
<style>
:root {
  --bg:#08090f; --card:#0e1221; --border:#1e2840;
  --accent:#00ffcc; --blue:#58a6ff; --green:#3fb950; --red:#f85149;
  --yellow:#e3b341; --cyan:#39c5cf;
  --text:#c9d1d9; --muted:#6b7a99;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;padding:24px;max-width:960px;margin:0 auto}
h1{color:var(--accent);font-size:1.6rem;margin-bottom:4px}
.subtitle{color:var(--muted);font-size:.9rem;margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:8px}
button{
  background:var(--accent);color:#000;border:none;border-radius:6px;
  padding:8px 16px;cursor:pointer;font-size:.85rem;font-weight:600;
  transition:opacity .15s;
}
button:hover{opacity:.85}
button:disabled{opacity:.3;cursor:default}
button.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
button.gray{background:var(--border);color:var(--text)}
button.red{background:var(--red);color:#fff}
button.green{background:var(--green);color:#02150a}
button.small{padding:4px 10px;font-size:.78rem}

.topnav{display:flex;align-items:center;gap:10px;padding-bottom:10px;margin-bottom:20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.topnav-title{font-size:1.1rem;font-weight:700;color:var(--accent);margin-right:4px}
.topnav-link{color:var(--muted);text-decoration:none;font-size:.8rem;padding:3px 9px;border-radius:6px;border:1px solid transparent}
.topnav-link:hover{color:var(--text);border-color:var(--border)}
.mqtt-dot{width:8px;height:8px;border-radius:50%;background:#444;display:inline-block;transition:background .3s;flex-shrink:0;margin-left:auto}
.mqtt-dot.ok{background:var(--green);box-shadow:0 0 5px var(--green)}
.mqtt-dot.err{background:var(--red)}

.dev-status{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dev-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:.8rem;font-weight:600}
.dev-badge.online{background:#0f2418;color:var(--green)}
.dev-badge.offline{background:#2a0f0f;color:var(--red)}
.dev-meta{color:var(--muted);font-size:.8rem}
.svc-row{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.svc-row .svc-label{font-size:.82rem;color:var(--text);min-width:130px}
.svc-state{font-size:.75rem;color:var(--muted);padding:2px 8px;border-radius:10px;background:var(--bg)}
.svc-state.active{color:var(--accent)}

.chan-strip{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.chan-btn{
  width:38px;height:32px;background:var(--bg);border:1px solid var(--border);border-radius:6px;
  color:var(--muted);font-size:.78rem;font-weight:600;cursor:pointer;padding:0;
}
.chan-btn:hover{border-color:var(--accent);color:var(--accent)}
.chan-btn.sel{background:#001a12;border-color:var(--accent);color:var(--accent)}
.chan-empty{color:var(--muted);font-size:.85rem;padding:8px 0}

.band-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:16px}
.band{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px}
.band-title{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--cyan);margin-bottom:10px}
.param-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.param-row:last-child{margin-bottom:0}
.param-row label{font-size:.78rem;color:var(--muted);width:64px;flex-shrink:0}
.param-row input{
  flex:1;background:var(--card);border:1px solid var(--border);border-radius:6px;
  color:var(--text);padding:5px 8px;font-size:.85rem;min-width:0;
}
.param-row input:focus{border-color:var(--accent);outline:none}
.param-row input.dirty{border-color:var(--yellow)}
.param-row input.sent{border-color:var(--accent)}
</style>
</head>
<body>

<div class="topnav">
  <div class="topnav-title">GAIA MixerAudio</div>
  <a href="portal.html" class="topnav-link">⌂ Portal</a>
  <a href="admin.html" class="topnav-link">Admin</a>
  <a href="patchdeck.html" class="topnav-link">🎛 PatchDeck</a>
  <span id="mqtt-dot" class="mqtt-dot"></span>
</div>

<h1>🎚 MixerAudio</h1>
<div class="subtitle">Parametri del mixer audio per canale — ControllerV7 (analisi audio a 47 canali)</div>

<div class="card">
  <h2>Stato device</h2>
  <div class="dev-status">
    <span id="dev-badge" class="dev-badge offline">● offline</span>
    <span class="dev-meta" id="dev-meta">nessun dato ricevuto</span>
  </div>
  <div class="svc-row">
    <span class="svc-label">Audio Device</span>
    <span id="svc-audio_device-state" class="svc-state">—</span>
    <button class="small green" data-svc="audio_device" data-action="enable">▶ Start</button>
    <button class="small red" data-svc="audio_device" data-action="disable">■ Stop</button>
    <button class="small gray" data-svc="audio_device" data-action="restart">↺ Restart</button>
  </div>
  <div class="svc-row">
    <span class="svc-label">Sorgente</span>
    <span id="svc-audio_source_live-state" class="svc-state">live: —</span>
    <button class="small secondary" data-svc="audio_source_live" data-action="enable">🎙 Live</button>
    <span id="svc-audio_source_file-state" class="svc-state">file: —</span>
    <button class="small secondary" data-svc="audio_source_file" data-action="enable">📁 File demo</button>
  </div>
</div>

<div class="card">
  <h2>Canale</h2>
  <div id="chan-strip" class="chan-strip"></div>
  <div id="chan-empty" class="chan-empty" style="display:none">In attesa dati dal device (nessun canale scoperto ancora)…</div>
  <div id="band-grid" class="band-grid"></div>
</div>

<script>
// Stesso pattern MQTT-over-WS di admin.html/patchdeck.html.
const MX_BROKER = '192.168.1.142';
const MX_DEVICE_ID = 'td-controllerv7-macbook-air-di-mauro';

// Ordine noto dei suffissi per canale (GAIA_INTERFACE.md / TD4Gaia
// 2026-08-24,3) -- raggruppati per banda. Un canale puo' non avere tutti
// questi param (o averne di nuovi): la lista reale viene sempre scoperta
// dal payload live "params" del device, questo e' solo l'ordine di
// visualizzazione preferito quando presenti.
const MX_BANDS = [
  { title: 'Low',  strip: /^Low/,  params: ['Lowgain', 'Lowthresh', 'Lowsmooth'] },
  { title: 'Mid',  strip: /^Mid/,  params: ['Midgain', 'Midthresh', 'Midsmooth'] },
  { title: 'High', strip: /^High/, params: ['Highgain', 'Highthresh', 'Highsmooth'] },
  { title: 'Percussione', strip: /thresh$/, params: ['Kickthresh', 'Snarethresh', 'Rythmthresh'] },
];

let mxClient = null;
let mxDevice = null;
let mxChannel = null;   // numero canale selezionato

function mxSetConn(ok) {
  document.getElementById('mqtt-dot').className = 'mqtt-dot ' + (ok ? 'ok' : 'err');
}

function mxSendAction(service, action) {
  if (!mxClient || !mxClient.connected) return;
  mxClient.publish(`gaia/device/${MX_DEVICE_ID}/command`, JSON.stringify({ action, service }));
}

function mxSendParam(param, value) {
  if (!mxClient || !mxClient.connected) return;
  mxClient.publish(`gaia/device/${MX_DEVICE_ID}/command`, JSON.stringify({ action: 'set', param, value }));
}

// Il device pubblica lo status via heartbeat throttlato lato TD (~20-30s,
// gaia_device_agent.py._HEARTBEAT_S), troppo lento per "leggere ogni
// secondo". Ma _apply_command() rifà SEMPRE un _publish_status() a fine
// funzione qualunque sia l'azione (anche "status" su un service inventato,
// verificato dal vivo) -- lo sfruttiamo per forzare un refresh ogni
// secondo mentre questa pagina è aperta e visibile, senza bisogno di
// nessuna modifica lato TD.
let mxPollTimer = null;
function mxStartPolling() {
  if (mxPollTimer) return;
  mxPollTimer = setInterval(() => {
    if (document.hidden || !mxClient?.connected) return;
    mxClient.publish(`gaia/device/${MX_DEVICE_ID}/command`, JSON.stringify({ action: 'status', service: '_poll' }));
  }, 1000);
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && mxClient?.connected) {
    mxClient.publish(`gaia/device/${MX_DEVICE_ID}/command`, JSON.stringify({ action: 'status', service: '_poll' }));
  }
});

// ch{N}_{Suffisso} -> { N: {Suffisso: valore} }, scoperto dal vivo dal
// payload "params" (non c'e' un topic-matrice come patchdeck_matrix per
// questo device, quindi qui la convenzione di naming e' l'unica fonte).
function mxChannelsFromParams(params) {
  const byChan = {};
  for (const [key, val] of Object.entries(params || {})) {
    const m = key.match(/^ch(\d+)_(.+)$/);
    if (!m) continue;
    const n = parseInt(m[1], 10);
    (byChan[n] ||= {})[m[2]] = val;
  }
  return byChan;
}

function mxRenderChanStrip(byChan) {
  const strip = document.getElementById('chan-strip');
  const empty = document.getElementById('chan-empty');
  const nums = Object.keys(byChan).map(Number).sort((a, b) => a - b);
  if (!nums.length) {
    strip.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';
  if (mxChannel === null || !nums.includes(mxChannel)) mxChannel = nums[0];
  const key = nums.join(',');
  if (strip.dataset.key !== key) {
    strip.dataset.key = key;
    strip.innerHTML = nums.map(n => `<button class="chan-btn" data-chan="${n}">${n}</button>`).join('');
    strip.querySelectorAll('.chan-btn').forEach(btn => {
      btn.onclick = () => { mxChannel = parseInt(btn.dataset.chan, 10); mxRenderAll(); };
    });
  }
  strip.querySelectorAll('.chan-btn').forEach(btn => {
    btn.classList.toggle('sel', parseInt(btn.dataset.chan, 10) === mxChannel);
  });
}

function mxCommitField(input, param) {
  const v = parseFloat(input.value);
  if (Number.isNaN(v)) return;
  input.classList.remove('dirty');
  input.classList.add('sent');
  setTimeout(() => input.classList.remove('sent'), 400);
  mxSendParam(param, v);
}

// Ricostruisce i controlli SOLO quando cambia il canale selezionato --
// vedi mxUpdateBandValues() per l'aggiornamento periodico dei valori
// (deve toccare solo il .value degli input, mai rifare l'innerHTML: con
// un poll ogni secondo, ricreare il DOM ad ogni giro cancellerebbe la
// digitazione in corso e il focus, esattamente il bug segnalato).
let mxBuiltForChannel = null;
function mxBuildBands(chanParams) {
  const grid = document.getElementById('band-grid');
  mxBuiltForChannel = mxChannel;
  if (!chanParams) { grid.innerHTML = ''; return; }
  const known = new Set(MX_BANDS.flatMap(b => b.params));
  const extra = Object.keys(chanParams).filter(k => !known.has(k)).sort();
  const bands = extra.length ? [...MX_BANDS, { title: 'Altro', params: extra }] : MX_BANDS;

  grid.innerHTML = bands.map(band => {
    const rows = band.params.filter(p => p in chanParams).map(p => {
      const label = band.strip ? (p.replace(band.strip, '') || p) : p;
      return `
      <div class="param-row">
        <label title="ch${mxChannel}_${p}">${label}</label>
        <input type="number" step="0.01" value="${chanParams[p]}" data-param="ch${mxChannel}_${p}">
      </div>`;
    }).join('');
    return rows ? `<div class="band"><div class="band-title">${band.title}</div>${rows}</div>` : '';
  }).join('');

  grid.querySelectorAll('input[data-param]').forEach(input => {
    input.addEventListener('input', () => input.classList.add('dirty'));
    input.addEventListener('blur', () => { if (input.classList.contains('dirty')) mxCommitField(input, input.dataset.param); });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); });
  });
}

function mxUpdateBandValues(chanParams) {
  if (!chanParams) return;
  document.querySelectorAll('#band-grid input[data-param]').forEach(input => {
    // Non toccare un campo che l'utente sta editando ora (focus) o ha
    // gia' modificato ma non ancora inviato (dirty, in attesa del blur) --
    // altrimenti un valore letto dal device sovrascriverebbe la modifica
    // dell'utente prima che parta il comando "set".
    if (input === document.activeElement || input.classList.contains('dirty')) return;
    const suffix = input.dataset.param.replace(/^ch\d+_/, '');
    if (suffix in chanParams) {
      const v = String(chanParams[suffix]);
      if (input.value !== v) input.value = v;
    }
  });
}

function mxRenderSvc(svc) {
  const el = document.getElementById(`svc-${svc}-state`);
  if (!el) return;
  const state = (mxDevice?.services || {})[svc] || 'inactive';
  const label = svc === 'audio_source_live' ? 'live' : svc === 'audio_source_file' ? 'file' : state;
  el.textContent = svc.startsWith('audio_source_') ? `${label}: ${state}` : state;
  el.classList.toggle('active', state === 'active');
}

function mxRenderAll() {
  const badge = document.getElementById('dev-badge');
  const meta = document.getElementById('dev-meta');
  if (!mxDevice) return;
  const offline = mxDevice._offline;
  badge.className = 'dev-badge ' + (offline ? 'offline' : 'online');
  badge.textContent = offline ? '● offline' : '● online';
  meta.textContent = `${mxDevice.name || MX_DEVICE_ID} · ip ${mxDevice.ip || '?'}`;
  mxRenderSvc('audio_device');
  mxRenderSvc('audio_source_live');
  mxRenderSvc('audio_source_file');

  const byChan = mxChannelsFromParams(mxDevice.params);
  mxRenderChanStrip(byChan);
  const chanParams = mxChannel !== null ? byChan[mxChannel] : null;
  if (mxBuiltForChannel !== mxChannel) mxBuildBands(chanParams);
  else mxUpdateBandValues(chanParams);
}

function mxInit() {
  const mqttUrl = `ws://${MX_BROKER}:9001`;
  function start() {
    mxClient = mqtt.connect(mqttUrl);
    mxClient.on('connect', () => {
      mxSetConn(true);
      mxClient.subscribe('gaia/device/+/status');
      mxStartPolling();
    });
    mxClient.on('error',   () => mxSetConn(false));
    mxClient.on('offline', () => mxSetConn(false));
    mxClient.on('message', (topic, raw) => {
      if (!raw || !raw.length) return;
      try {
        const d = JSON.parse(raw.toString());
        if (d.device_id !== MX_DEVICE_ID) return;
        d._offline = false;
        d._lastSeen = Date.now();
        mxDevice = d;
        mxRenderAll();
      } catch (e) {}
    });
    setInterval(() => {
      if (mxDevice && Date.now() - mxDevice._lastSeen > 90000 && !mxDevice._offline) {
        mxDevice._offline = true;
        mxRenderAll();
      }
    }, 10000);
  }
  if (typeof mqtt !== 'undefined') {
    start();
  } else {
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/mqtt/dist/mqtt.min.js';
    s.onload = start;
    document.head.appendChild(s);
  }
}

document.querySelectorAll('[data-svc][data-action]').forEach(btn => {
  btn.onclick = () => mxSendAction(btn.dataset.svc, btn.dataset.action);
});

mxInit();
</script>
</body>
</html>
